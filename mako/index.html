<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#f6f1e8" media="(prefers-color-scheme:light)">
<meta name="theme-color" content="#14120f" media="(prefers-color-scheme:dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>茉子日记</title>
<style>
:root{
  --bg:#f6f1e8; --paper:#fbf7f0; --ink:#2b2521; --ink-soft:#6d6259;
  --rule:#e3d8c8; --accent:#96684f; --accent-soft:#f0e3d6; --mark:#f3d9a4;
  /* 手写味：霞鹜文楷（OFL）。CDN 挂了自动退回系统楷体，不会白屏。 */
  --serif:"Yozai","LXGW WenKai","Zen Kurenaido","Klee One","Noto Serif SC","Source Han Serif SC","Kaiti SC","STKaiti","KaiTi","Songti SC",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
  --fs:17px; --lh:1.95;
  --pad:22px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
}
html[data-theme="dark"]{
  --bg:#14120f; --paper:#1b1815; --ink:#e9e2d6; --ink-soft:#9d9386;
  --rule:#302a22; --accent:#c99a83; --accent-soft:#2a2118; --mark:#5a4a2c;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--serif); font-size:var(--fs); line-height:var(--lh);
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
  padding-top:calc(52px + var(--safe-t));
  padding-bottom:calc(64px + var(--safe-b));
}

/* ── 顶栏 ── */
header{
  position:fixed; top:0; left:0; right:0; z-index:30;
  padding:calc(8px + var(--safe-t)) 14px 8px;
  display:grid; grid-template-columns:1fr auto auto; align-items:center; gap:10px;
  background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:saturate(1.2) blur(12px); -webkit-backdrop-filter:saturate(1.2) blur(12px);
  border-bottom:1px solid var(--rule);
  height:calc(52px + var(--safe-t));
}
header .t{font-size:13px; letter-spacing:.3em; color:var(--accent); min-width:0;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding-left:2px}
/* 分段切换：和「在读」页共用同一套，位置固定在右上 */
.seg{display:inline-flex; border:1px solid var(--rule); border-radius:999px; overflow:hidden; height:34px}
.seg a{display:inline-flex; align-items:center; padding:0 14px; text-decoration:none;
  font-family:var(--sans); font-size:12px; color:var(--ink-soft); letter-spacing:.06em;
  transition:background .18s ease, color .18s ease}
.seg a.on{background:var(--accent); color:var(--paper)}
.seg a:not(.on):active{background:var(--accent-soft)}
header button{
  appearance:none; border:1px solid var(--rule); background:transparent; color:var(--ink-soft);
  font-family:var(--sans); font-size:12px; padding:0 12px; border-radius:999px; cursor:pointer;
  min-height:34px; height:34px;
}
header button:active{background:var(--accent-soft)}

/* ── 正文 ── */
main{padding:26px var(--pad) 10px; max-width:760px; margin:0 auto}
.head{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; margin-bottom:4px}
.head h1{font-size:clamp(20px,5.4vw,28px); font-weight:400; letter-spacing:.04em; margin:0}
.head .wk{font-family:var(--sans); font-size:12px; color:var(--ink-soft); letter-spacing:.08em}
.badge{font-family:var(--sans); font-size:10.5px; letter-spacing:.08em; color:var(--accent);
  border:1px solid var(--accent); border-radius:999px; padding:2px 9px}
.rule{height:1px; background:var(--rule); margin:16px 0 22px}
.body p{margin:0 0 0.95em}
.body mark{background:var(--mark); color:inherit; padding:0 1px; border-radius:2px}
.foot{margin-top:30px; padding-top:14px; border-top:1px solid var(--rule);
  display:flex; justify-content:space-between; font-family:var(--sans); font-size:11px; color:var(--ink-soft)}
.sign{font-family:var(--serif); letter-spacing:.3em; color:var(--accent)}
article{animation:fade .18s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.body{overflow-wrap:anywhere}
.empty{color:var(--ink-soft); font-family:var(--sans); font-size:13px; padding:40px 0}

/* ── 底部操作条 ── */
nav.bottom{
  position:fixed; bottom:0; left:0; right:0; z-index:30;
  display:grid; grid-template-columns:1fr 1.2fr 1fr; gap:8px;
  padding:8px 12px calc(8px + var(--safe-b));
  background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:saturate(1.2) blur(12px); -webkit-backdrop-filter:saturate(1.2) blur(12px);
  border-top:1px solid var(--rule);
}
nav.bottom button{
  appearance:none; border:1px solid var(--rule); background:transparent; color:var(--ink-soft);
  font-family:var(--sans); font-size:13px; padding:11px 0; border-radius:10px; cursor:pointer; min-height:44px;
}
nav.bottom button:active{background:var(--accent-soft)}
nav.bottom button:disabled{opacity:.32}
nav.bottom .go{border-color:var(--accent); color:var(--accent)}

/* ── 抽屉：目录 + 搜索 ── */
.scrim{position:fixed; inset:0; background:rgba(0,0,0,.42); opacity:0; pointer-events:none;
  transition:opacity .22s ease; z-index:40}
.scrim.on{opacity:1; pointer-events:auto}
.drawer{
  position:fixed; z-index:41; left:0; right:0; bottom:0; max-height:82dvh;
  background:var(--paper); border-radius:18px 18px 0 0;
  transform:translateY(101%); transition:transform .26s cubic-bezier(.22,.9,.28,1);
  display:flex; flex-direction:column; padding-bottom:var(--safe-b);
  box-shadow:0 -12px 40px rgba(0,0,0,.22);
}
.drawer.on{transform:none}
.drawer .grab{width:38px; height:4px; border-radius:99px; background:var(--rule); margin:10px auto 6px}
.drawer .dhead{display:flex; align-items:center; gap:10px; padding:4px 16px 10px}
.drawer .dhead .meta{font-family:var(--sans); font-size:11px; color:var(--ink-soft); flex:1}
.drawer input[type=search]{
  appearance:none; width:calc(100% - 32px); margin:0 16px 10px;
  padding:10px 12px; font-family:var(--sans); font-size:14px;
  border:1px solid var(--rule); border-radius:10px; background:transparent; color:var(--ink); outline:none;
}
.drawer input[type=search]:focus{border-color:var(--accent)}
.listbox{overflow-y:auto; -webkit-overflow-scrolling:touch; padding:0 10px 14px}
.ym{font-family:var(--sans); font-size:10.5px; letter-spacing:.16em; color:var(--ink-soft); margin:14px 8px 6px}
.item{display:flex; gap:10px; align-items:baseline; width:100%; text-align:left; border:0;
  background:transparent; color:inherit; font-family:inherit; font-size:14px;
  padding:12px 10px; border-radius:10px; cursor:pointer; min-height:46px}
.item:active{background:var(--accent-soft)}
.item[aria-current="true"]{background:var(--accent-soft); box-shadow:inset 3px 0 0 var(--accent)}
.item .d{font-family:var(--sans); font-size:12px; color:var(--ink-soft); white-space:nowrap}
.item .p{flex:1; opacity:.82; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}

/* ── 桌面：还原成两列 ── */
@media (min-width:900px){
  body{padding:0}
  header{position:fixed; left:0; right:0}
  .shell{display:grid; grid-template-columns:264px 1fr; min-height:100dvh; padding-top:52px}
  aside{display:block !important; border-right:1px solid var(--rule); background:var(--paper);
    position:sticky; top:52px; height:calc(100dvh - 52px); overflow-y:auto; padding:22px 18px}
  main{padding:46px 6vw 20vh; max-width:860px; margin:0 auto; justify-self:center}
  nav.bottom{display:none}
  .drawer,.scrim{display:none}
  #menuBtn{display:none}
  .deskonly{display:block}
}
@media (max-width:899px){
  aside{display:none}
  .deskonly{display:none}
}
</style>

<style id="mk-shell">
:root{
  --bg:#f6f1e8; --paper:#fbf7f0; --ink:#2b2521; --ink-soft:#6d6259;
  --rule:#e3d8c8; --accent:#96684f; --accent-soft:#f0e3d6;
  --serif:"Yozai","LXGW WenKai","Zen Kurenaido","Klee One","Noto Serif SC","Source Han Serif SC","Kaiti SC","STKaiti","KaiTi","Songti SC",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
}
html[data-theme="dark"]{
  --bg:#14120f; --paper:#1b1815; --ink:#e9e2d6; --ink-soft:#9d9386;
  --rule:#302a22; --accent:#c99a83; --accent-soft:#2a2118;
}
html,body{background:var(--bg)!important;color:var(--ink)!important;font-family:var(--serif)!important;
  padding-top:0!important;margin:0!important}

/* 顶栏：三个页面完全同一套（高度/位置/字距全部写死） */
html body header.mk-head{
  position:sticky!important; top:0!important; z-index:60!important;
  height:54px!important; min-height:54px!important; max-height:54px!important;
  padding:0 24px!important; margin:0!important;
  display:flex!important; align-items:center!important; gap:18px!important;
  box-sizing:border-box!important;
  background:color-mix(in srgb, var(--bg) 90%, transparent)!important;
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--rule)!important;
}
html body header.mk-head .mk-brand{
  font-family:var(--serif)!important; font-weight:600!important;
  font-size:17.5px!important; letter-spacing:.14em!important; line-height:54px!important;
  color:var(--ink)!important; text-decoration:none!important; margin:0!important; padding:0!important;
}
html body header.mk-head .mk-seg{margin-left:auto!important; display:flex!important; align-items:center!important; gap:6px!important}
html body header.mk-head .mk-seg a{
  font-family:var(--sans)!important; font-size:13px!important;
  line-height:27px!important; height:27px!important; padding:0 14px!important;
  border-radius:999px!important; box-sizing:border-box!important; display:inline-block!important;
  color:var(--ink-soft)!important; text-decoration:none!important; border:1px solid transparent!important;
}
html body header.mk-head .mk-seg a.on{color:var(--accent)!important;border-color:var(--accent)!important;background:var(--accent-soft)!important}
html body header.mk-head #themeBtn{
  font-family:var(--sans)!important; font-size:12px!important; letter-spacing:.06em!important;
  line-height:28px!important; height:28px!important; min-height:28px!important; max-height:28px!important;
  padding:0 12px!important; margin:0!important;
  border:1px solid var(--rule)!important; border-radius:999px!important;
  background:transparent!important; color:var(--ink-soft)!important; cursor:pointer!important;
  display:inline-flex!important; align-items:center!important; box-sizing:border-box!important;
}
html body header.mk-head #themeBtn:hover{color:var(--ink)!important;border-color:var(--accent)!important}

/* 两栏外壳：左栏 264px + 正文 760px 居中 */
html body .shell{
  display:grid!important; grid-template-columns:264px minmax(0,1fr)!important;
  align-items:start!important; padding:0!important; margin:0!important; gap:0!important;
}
html body .shell > aside.mk-side{
  position:sticky!important; top:54px!important;
  max-height:calc(100vh - 54px)!important; overflow:auto!important;
  padding:26px 18px 40px 24px!important; box-sizing:border-box!important;
  border-right:1px solid var(--rule)!important;
}
html body .shell > main{
  max-width:760px!important; width:100%!important; min-width:0!important;
  margin:0 auto!important; padding:34px 24px 120px!important; box-sizing:border-box!important;
  justify-self:center!important;
}
html body .shell > aside.mk-side h2{
  font-family:var(--sans)!important; font-size:12px!important; letter-spacing:.18em!important;
  color:var(--ink-soft)!important; font-weight:500!important; margin:0 0 12px!important;
}
html body .shell > aside.mk-side ul{list-style:none!important;margin:0!important;padding:0!important}
html body .shell > aside.mk-side li{margin:0 0 2px!important}
html body .shell > aside.mk-side a{
  display:block!important; padding:6px 10px!important; border-radius:8px!important;
  color:var(--ink-soft)!important; text-decoration:none!important;
  font-family:var(--sans)!important; font-size:13px!important; line-height:1.5!important;
  white-space:nowrap!important; overflow:hidden!important; text-overflow:ellipsis!important;
}
html body .shell > aside.mk-side a:hover{color:var(--ink)!important;background:var(--accent-soft)!important}
@media (max-width:820px){
  html body .shell{grid-template-columns:1fr!important}
  html body .shell > aside.mk-side{display:none!important}
}

/* 「她自己的时候」：日记页底部的一条，不混进日记正文 */
html body .mk-private{
  margin:44px 0 0!important; padding-top:18px!important; border-top:1px dashed var(--rule)!important;
}
html body .mk-private h2{
  font-family:var(--sans)!important; font-size:12px!important; letter-spacing:.16em!important;
  color:var(--ink-soft)!important; font-weight:500!important; margin:0 0 10px!important;
}
html body .mk-private h2 small{font-size:11px!important;opacity:.7;margin-left:8px}
html body .mk-private ul{list-style:none!important;margin:0!important;padding:0!important}
html body .mk-private li{
  display:flex!important; gap:10px!important; align-items:baseline!important;
  font-family:var(--sans)!important; font-size:12.5px!important; color:var(--ink-soft)!important;
  padding:4px 0!important;
}
html body .mk-private li .d{opacity:.75}
html body .mk-private li .t{color:var(--accent)!important;font-variant-numeric:tabular-nums}

/* ── 正文标题统一：三个页面同一套（逛网页原来字体不对就是这里缺的）── */
html body .shell > main h1,
html body .shell > main h2,
html body .shell > main h3{
  font-family:var(--serif)!important; color:var(--ink)!important; font-weight:600!important;
  letter-spacing:.04em!important;
}
html body .shell > main h1{font-size:22px!important;line-height:1.5!important;margin:0 0 14px!important}
html body .shell > main h2{font-size:15.5px!important;line-height:1.6!important;margin:30px 0 10px!important;
  display:flex!important;align-items:baseline!important;gap:8px!important}
html body .shell > main h2 small{font-family:var(--sans)!important;font-size:11.5px!important;
  color:var(--ink-soft)!important;font-weight:400!important;letter-spacing:.02em!important}
html body .shell > main h3{font-size:14.5px!important;line-height:1.6!important;margin:20px 0 8px!important}

/* ── 手机端自适应：不许横向溢出 ── */
html body{overflow-x:hidden!important}
html body .shell > main img,
html body .shell > main video,
html body .shell > main table,
html body .shell > main pre{max-width:100%!important;height:auto!important}
html body .shell > main pre{overflow-x:auto!important}
html body .shell > main *{max-width:100%!important;box-sizing:border-box!important}
@media (max-width:820px){
  html body header.mk-head{padding:0 14px!important;gap:10px!important}
  html body header.mk-head .mk-brand{font-size:16px!important;letter-spacing:.1em!important}
  html body header.mk-head .mk-seg{gap:2px!important}
  html body header.mk-head .mk-seg a{font-size:12.5px!important;padding:0 10px!important}
  html body header.mk-head #themeBtn{padding:0 9px!important;font-size:11.5px!important}
  html body .shell{grid-template-columns:1fr!important}
  html body .shell > aside.mk-side{display:none!important}
  html body .shell > main{padding:20px 16px 96px!important}
  html body .shell > main h1{font-size:20px!important}
  html body .shell > main h2{font-size:15px!important;margin:24px 0 8px!important}
}

/* ── 字体渲染方式统一：逛网页原来是 auto（亚像素，笔画偏粗），
   另两页是 antialiased（灰度，偏细）。同一个字栈看着像两种字体就是这里。── */
html, html body, html body header.mk-head, html body header.mk-head *,
html body .shell > main, html body .shell > main *,
html body .shell > aside.mk-side, html body .shell > aside.mk-side *{
  -webkit-font-smoothing:antialiased!important;
  -moz-osx-font-smoothing:grayscale!important;
  text-rendering:geometricPrecision!important;
}

/* ── 正文字号/行高统一（逛网页原来是 16px/1.7，另两页 17px/1.95）── */
html body{font-size:17px!important;line-height:1.95!important}
html body .shell > main{font-size:17px!important;line-height:1.95!important}
html body .shell > main p,
html body .shell > main li{font-size:17px!important;line-height:1.95!important}
@media (max-width:820px){
  html body, html body .shell > main, html body .shell > main p, html body .shell > main li{font-size:16px!important;line-height:1.9!important}
}

/* ── 站名钉死：单一字体 + 不合成字重（否则各页落到不同的后备字体上）── */
html body header.mk-head .mk-brand{
  font-family:"Yozai"!important;
  font-weight:400!important;
  font-synthesis:none!important;
  -webkit-text-stroke:0!important;
  text-shadow:none!important;
  font-size:18px!important;
  letter-spacing:.16em!important;
}
html body header.mk-head .mk-seg a,
html body header.mk-head #themeBtn{
  font-family:"Yozai"!important;
  font-weight:400!important;
  font-synthesis:none!important;
}

/* 「她自己的时候」落在正文那一列（main 之后，不进 main，避免被 JS 覆盖） */
html body .shell > .mk-private{
  grid-column:2!important; width:100%!important; max-width:760px!important;
  margin:0 auto!important; padding:0 24px 70px!important; box-sizing:border-box!important;
  border-top:1px dashed var(--rule)!important;
  margin-top:0!important;
}
@media (max-width:820px){
  html body .shell > .mk-private{grid-column:1!important;padding:0 16px 60px!important}
}
</style>

<script>
(function(){
  var DATA = (window.__DIARY__ && window.__DIARY__.entries) ? window.__DIARY__ : {entries:[]};
  var entries = DATA.entries || [];
  var cur = 0;
  var root = document.documentElement;
  var main = document.getElementById('main');

  // 主题
  var savedTheme = localStorage.getItem('mk.theme');
  if (savedTheme) root.setAttribute('data-theme', savedTheme);
  else root.setAttribute('data-theme', window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  var FS_STEPS = [15,17,19,21,23];
  var savedFs = parseInt(localStorage.getItem('mk.fs') || '17', 10);

  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function rxEsc(s){ return String(s).replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }
  function hi(s, kw){
    var out = esc(s);
    if (!kw) return out;
    try { return out.replace(new RegExp('(' + rxEsc(kw) + ')','gi'), '<mark>$1</mark>'); } catch(e){ return out; }
  }
  function plain(s){ return String(s).replace(/\s+/g,' ').trim(); }
  function dnum(d){ return String(d).replace(/-/g,' . '); }

  function renderList(el, kw, active){
    var groups = {}, order = [];
    entries.forEach(function(e, i){
      if (kw && plain(e.text).indexOf(kw) < 0 && e.date.indexOf(kw) < 0) return;
      var ym = e.date.slice(0,7);
      if (!groups[ym]) { groups[ym] = []; order.push(ym); }
      groups[ym].push({e:e,i:i});
    });
    var html = '';
    if (!order.length) html = '<div class="empty" style="padding:16px 8px">没有匹配</div>';
    order.forEach(function(ym){
      html += '<div class="ym">' + ym.replace('-','.') + '</div>';
      groups[ym].forEach(function(r){
        html += '<button class="item" data-i="' + r.i + '"' + (r.i === active ? ' aria-current="true"' : '') + '>'
             + '<span class="d">' + r.e.date.slice(5) + '</span>'
             + '<span class="p">' + esc(plain(r.e.text).slice(0,20)) + '</span></button>';
      });
    });
    el.innerHTML = html;
    Array.prototype.forEach.call(el.querySelectorAll('.item'), function(b){
      b.addEventListener('click', function(){ show(parseInt(b.dataset.i,10)); closeDrawer(); });
    });
  }

  function show(i){
    if (!entries.length) {
      main.innerHTML = '<div class="empty">这里还没有日记。</div>';
      return;
    }
    cur = Math.max(0, Math.min(entries.length - 1, i));
    var e = entries[cur];
    var kw = (document.getElementById('mQ').value || document.getElementById('deskQ').value || '').trim();
    var paras = e.text.split(/\n\s*\n/).filter(function(p){ return p.trim(); });
    var pos = entries.length - cur;   // 第几天（从最早算）
    main.innerHTML = '<article>'
      + '<div class="head"><h1>' + dnum(e.date) + '</h1>'
      + '<span class="wk">' + (e.weekday||'') + '</span>'
      + '<span class="badge">第 ' + pos + ' 天</span></div>'
      + '<div class="rule"></div>'
      + '<div class="body">' + paras.map(function(p){ return '<p>' + hi(p.trim(), kw) + '</p>'; }).join('') + '</div>'
      + '<div class="foot"><span>' + plain(e.text).replace(/\s/g,'').length + ' 字</span><span class="sign">茉子</span></div>'
      + '</article>';
    document.getElementById('topTitle').textContent = e.date;
    document.getElementById('prevBtn').disabled = cur >= entries.length - 1;
    document.getElementById('nextBtn').disabled = cur <= 0;
    localStorage.setItem('mk.last', e.date);
    if (!kw) { renderList(document.getElementById('mList'), '', cur); renderList(document.getElementById('deskList'), '', cur); }
    window.scrollTo(0, 0);
  }

  // 抽屉
  var drawer = document.getElementById('drawer'), scrim = document.getElementById('scrim');
  function openDrawer(){
    document.getElementById('drawerMeta').textContent = '共 ' + entries.length + ' 篇' + (DATA.firstDay ? ' · 自 ' + DATA.firstDay : '');
    renderList(document.getElementById('mList'), document.getElementById('mQ').value.trim(), cur);
    drawer.classList.add('on'); scrim.classList.add('on');
  }
  function closeDrawer(){ drawer.classList.remove('on'); scrim.classList.remove('on'); }
  var _mb = document.getElementById('menuBtn'); if (_mb) _mb.addEventListener('click', openDrawer);
  document.getElementById('menuBtn2').addEventListener('click', openDrawer);
  scrim.addEventListener('click', closeDrawer);

  // 搜索
  function onSearch(src){
    var kw = src.value.trim();
    renderList(document.getElementById('mList'), kw, cur);
    renderList(document.getElementById('deskList'), kw, cur);
    if (!kw) return;
    for (var i = 0; i < entries.length; i++) if (plain(entries[i].text).indexOf(kw) >= 0) { show(i); break; }
  }
  document.getElementById('mQ').addEventListener('input', function(){ onSearch(this); });
  document.getElementById('deskQ').addEventListener('input', function(){ onSearch(this); });

  // 主题 / 字号
  document.getElementById('themeBtn').addEventListener('click', function(){
    var now = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', now); localStorage.setItem('mk.theme', now);
  });
  root.style.setProperty('--fs', savedFs + 'px');
  document.getElementById('fontBtn').addEventListener('click', function(){
    var i = FS_STEPS.indexOf(parseInt(localStorage.getItem('mk.fs') || '17', 10));
    i = (i + 1) % FS_STEPS.length;
    var fs = FS_STEPS[i];
    root.style.setProperty('--fs', fs + 'px');
    localStorage.setItem('mk.fs', String(fs));
  });

  // 翻页 + 左右滑动
  document.getElementById('prevBtn').addEventListener('click', function(){ show(cur + 1); });
  document.getElementById('nextBtn').addEventListener('click', function(){ show(cur - 1); });
  var sx = 0, sy = 0, tracking = false;
  main.addEventListener('touchstart', function(ev){
    if (ev.touches.length !== 1) return;
    sx = ev.touches[0].clientX; sy = ev.touches[0].clientY; tracking = true;
  }, { passive: true });
  main.addEventListener('touchend', function(ev){
    if (!tracking) return; tracking = false;
    var t = ev.changedTouches[0];
    var dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 64 && Math.abs(dx) > Math.abs(dy) * 1.8) {
      if (dx < 0) show(cur + 1); else show(cur - 1);   // 左滑=更早，右滑=更晚
    }
  }, { passive: true });

  document.addEventListener('keydown', function(ev){
    if (ev.target && (ev.target.tagName === 'INPUT')) return;
    if (ev.key === 'ArrowLeft') show(cur + 1);
    if (ev.key === 'ArrowRight') show(cur - 1);
    if (ev.key === 'Escape') closeDrawer();
  });

  // 桌面侧栏统计
  document.getElementById('deskMeta').textContent = '常陆茉子 · 共 ' + entries.length + ' 篇';
  document.getElementById('drawerMeta').textContent = '共 ' + entries.length + ' 篇';

  var last = localStorage.getItem('mk.last'), start = 0;
  if (last) for (var k = 0; k < entries.length; k++) if (entries[k].date === last) { start = k; break; }
  show(start);
})();
</script>



<script id="mk-theme">
(function(){try{
  var root=document.documentElement,key='mk.theme';
  var saved=localStorage.getItem(key);
  root.setAttribute('data-theme',saved||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'));
  var btn=document.getElementById('themeBtn');
  if(btn&&!btn.dataset.mkBound){btn.dataset.mkBound='1';btn.addEventListener('click',function(){
    var next=root.getAttribute('data-theme')==='dark'?'light':'dark';
    root.setAttribute('data-theme',next);localStorage.setItem(key,next);
  });}
}catch(e){}})();
</script>
