<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#f6f1e8" media="(prefers-color-scheme:light)">
<meta name="theme-color" content="#14120f" media="(prefers-color-scheme:dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>在读</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cn-fontsource-yozai@1.0.6/font.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/lxgwwenkai-regular.css">
<style>
:root{
  --bg:#f6f1e8; --paper:#fbf7f0; --ink:#2b2521; --ink-soft:#6d6259;
  --rule:#e3d8c8; --accent:#96684f; --accent-soft:#f0e3d6; --mark:#f3d9a4;
  --serif:"Yozai","LXGW WenKai","Zen Kurenaido","Klee One","Noto Serif SC","Source Han Serif SC","Kaiti SC","STKaiti","KaiTi","Songti SC",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
  --fs:17px; --lh:1.95; --pad:22px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
}
html[data-theme="dark"]{
  --bg:#14120f; --paper:#1b1815; --ink:#e9e2d6; --ink-soft:#9d9386;
  --rule:#302a22; --accent:#c99a83; --accent-soft:#2a2118; --mark:#5a4a2c;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--serif); font-size:var(--fs); line-height:var(--lh);
  -webkit-font-smoothing:antialiased;
  padding-top:calc(52px + var(--safe-t));
  padding-bottom:calc(40px + var(--safe-b));
}
header{
  position:fixed; top:0; left:0; right:0; z-index:30;
  padding:calc(8px + var(--safe-t)) 14px 8px;
  display:grid; grid-template-columns:1fr auto auto; align-items:center; gap:10px;
  background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:saturate(1.2) blur(12px); -webkit-backdrop-filter:saturate(1.2) blur(12px);
  border-bottom:1px solid var(--rule);
  height:calc(52px + var(--safe-t));
}
header .t{font-size:13px; letter-spacing:.3em; color:var(--accent); min-width:0;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding-left:2px}
/* 分段切换：两页共用同一套，位置固定在右上 */
.seg{display:inline-flex; border:1px solid var(--rule); border-radius:999px; overflow:hidden; height:34px}
.seg a{display:inline-flex; align-items:center; padding:0 14px; text-decoration:none;
  font-family:var(--sans); font-size:12px; color:var(--ink-soft); letter-spacing:.06em;
  transition:background .18s ease, color .18s ease}
.seg a.on{background:var(--accent); color:var(--paper)}
.seg a:not(.on):active{background:var(--accent-soft)}
header button{
  appearance:none; border:1px solid var(--rule); background:transparent; color:var(--ink-soft);
  font-family:var(--sans); font-size:12px; padding:0 12px; border-radius:999px; cursor:pointer;
  min-height:34px; height:34px;
}
header button:active{background:var(--accent-soft)}

main{padding:22px var(--pad) 10px; max-width:760px; margin:0 auto}
.card{background:var(--paper); border:1px solid var(--rule); border-radius:14px; padding:18px 20px; margin-bottom:18px}
.book{font-size:clamp(19px,5vw,23px); line-height:1.5}
.meta{font-family:var(--sans); font-size:12px; color:var(--ink-soft); margin-top:6px; letter-spacing:.05em}

.row{display:flex; justify-content:space-between; align-items:baseline;
     font-family:var(--sans); font-size:12px; color:var(--ink-soft); letter-spacing:.06em; margin:16px 0 7px}
.row b{font-family:var(--serif); font-size:15px; color:var(--accent); font-weight:400}
.bar{height:6px; background:var(--rule); border-radius:99px; overflow:hidden}
.bar i{display:block; height:100%; background:var(--accent); border-radius:99px; transition:width .5s ease}
.bar.thin{height:4px; margin-top:6px}
.sub{font-family:var(--sans); font-size:12px; color:var(--ink-soft); margin-top:7px; letter-spacing:.03em}

h2{font-size:15px; font-weight:400; letter-spacing:.22em; color:var(--accent);
   margin:30px 0 10px; padding-bottom:10px; border-bottom:1px solid var(--rule)}

/* ── 抽屉：明显的可点区域 + 平滑展开 ── */
.fold{border-bottom:1px solid var(--rule)}
.fold .hd{
  display:flex; align-items:center; gap:10px; cursor:pointer;
  padding:16px 4px; font-family:var(--sans); font-size:13px; color:var(--ink-soft);
  transition:background .18s ease; user-select:none;
}
.fold .hd:hover{background:color-mix(in srgb, var(--accent-soft) 45%, transparent)}
.fold .hd .fd{font-family:var(--serif); font-size:16px; color:var(--ink); letter-spacing:.04em}
.fold .hd .fn{font-size:11.5px; color:var(--accent); border:1px solid var(--rule);
  border-radius:999px; padding:2px 9px; letter-spacing:.06em}
/* 箭头：收起时朝下 ⌄，展开时转 180° 朝上（▴） */
.fold .hd .cv{margin-left:auto; width:26px; height:26px; border-radius:50%;
  border:1px solid var(--rule); display:inline-flex; align-items:center; justify-content:center;
  color:var(--accent); font-size:14px; line-height:1;
  transform:rotate(0deg); transform-origin:50% 50%;
  transition:transform .3s cubic-bezier(.4,0,.2,1), background .18s ease}
.fold.on .hd .cv{transform:rotate(180deg); background:var(--accent-soft)}
/* 内容：用 height 过渡，JS 负责量高度 */
.fold .inner{height:0; overflow:hidden; transition:height .32s cubic-bezier(.4,0,.2,1)}
.fold.on .inner{height:auto}


.note{padding:13px 2px 15px; border-top:1px dashed var(--rule)}
.note .top{display:flex; align-items:center; gap:8px; font-family:var(--sans); font-size:11.5px;
  color:var(--ink-soft); letter-spacing:.06em; margin-bottom:6px}
.note .top .tm{font-variant-numeric:tabular-nums}
.note .top .pos{color:var(--accent); border:1px solid var(--rule); border-radius:999px; padding:1px 8px}
.note .top .pos.muted{color:var(--ink-soft)}
.note .body{-webkit-text-size-adjust:100%}

.spark{display:flex; align-items:flex-end; gap:7px; padding:8px 2px 0; overflow-x:auto}
.spark .col{display:flex; flex-direction:column; align-items:center; justify-content:flex-end; gap:5px; flex:0 0 auto}
.spark .col i{width:15px; background:var(--accent); opacity:.72; border-radius:3px 3px 0 0; display:block;
  transition:opacity .2s ease}
.spark .col:hover i{opacity:1}
.spark .col em{font-style:normal; font-family:var(--sans); font-size:10px; color:var(--ink-soft); white-space:nowrap}

.shelfitem{padding:14px 0; border-bottom:1px dashed var(--rule)}
.shelfitem:last-child{border-bottom:0}
.shelfitem .st{font-size:16px; line-height:1.6}
.shelfitem .sm{font-family:var(--sans); font-size:11.5px; color:var(--ink-soft); margin:5px 0 8px; letter-spacing:.04em}
.empty{font-family:var(--sans); font-size:13px; color:var(--ink-soft); padding:10px 0}
</style>
</head>
<body>
<header>
  <div class="t">在读</div>
  <nav class="seg">
    <a href="./index.html">日记</a>
    <a href="./reading.html" class="on">在读</a>
  </nav>
  <button id="themeBtn" aria-label="切换主题">深浅</button>
</header>
<main id="app"></main>
<script src="reading.js"></script>
<script>
(function(){
  var d = window.__READING__ || {};
  var app = document.getElementById('app');
  function esc(s){ return String(s==null?'':s).replace(/[&<>]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]; }); }
  function num(n){ return Number(n||0).toLocaleString('zh-CN'); }
  var h = '';

  // ── 进度卡 ──
  if (d.progress) {
    var p = d.progress;
    var left = Math.max(0, (p.totalChars||0) - (p.readChars||0));
    h += '<div class="card">'
      + '<div class="book">《' + esc(p.book) + '》</div>'
      + '<div class="meta">' + (p.chapterTitle ? esc(p.chapterTitle) + '　·　' : '') + '第 ' + p.chapter + ' / ' + p.chapters + ' 章</div>'

      + '<div class="row"><span>这一章</span><b>' + (p.chapterPct||0) + '%</b></div>'
      + '<div class="bar"><i style="width:' + (p.chapterPct||0) + '%"></i></div>'
      + '<div class="sub">本章 ' + num(p.chapterChars) + ' 字'
        + (p.segmentsLeft ? '　·　还剩 ' + p.segmentsLeft + ' 段，约 ' + p.minutesLeft + ' 分钟' : '') + '</div>'

      + '<div class="row"><span>整本</span><b>' + (p.charsPct||0) + '%</b></div>'
      + '<div class="bar"><i style="width:' + (p.charsPct||0) + '%"></i></div>'
      + '<div class="sub">已读 ' + num(p.readChars) + ' 字　·　还剩 ' + num(left) + ' 字</div>'

      + '<div class="row"><span>今天</span><b>' + num(p.todayChars) + ' / ' + num(p.perDay) + ' 字</b></div>'
      + '<div class="bar thin"><i style="width:' + Math.min(100, ((p.todayChars||0)/(p.perDay||1))*100) + '%"></i></div>'
      + (p.updatedAt ? '<div class="sub">上次翻页 ' + new Date(p.updatedAt).toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}) + '</div>' : '')
      + '</div>';
  } else {
    h += '<div class="card"><div class="empty">还没开始读。</div></div>';
  }

  // ── 她写下的（按天抽屉） ──
  h += '<h2>她写下的</h2>';
  if (d.notes && d.notes.length) {
    for (var i=0;i<d.notes.length;i++){
      var day = d.notes[i];
      h += '<div class="fold' + (i===0 ? ' on' : '') + '">'
        + '<div class="hd">'
        +   '<span class="fd">' + day.date + '</span>'
        +   '<span class="fn">' + day.items.length + ' 条</span>'
        +   '<span class="cv"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></span>'
        + '</div>'
        + '<div class="inner"><div>';
      for (var j=0;j<day.items.length;j++){
        var it = day.items[j];
        var pos = it.chapter
          ? '<span class="pos">第 ' + it.chapter + ' 章' + (it.pct!=null ? ' · ' + it.pct + '%' : '') + '</span>'
          : '<span class="pos muted">位置未记</span>';
        h += '<div class="note">'
          +  '<div class="top">'
          +    (it.time ? '<span class="tm">' + it.time + '</span>' : '')
          +    pos
          +  '</div>'
          +  '<div class="body">' + esc(it.body) + '</div>'
          + '</div>';
      }
      h += '</div></div></div>';
    }
  } else {
    h += '<div class="empty">还没有笔记。</div>';
  }

  // ── 每天读了多少 ──
  h += '<h2>每天读了多少</h2>';
  if (d.daily && d.daily.length) {
    var max = 1, k;
    for (k=0;k<d.daily.length;k++) max = Math.max(max, d.daily[k].chars);
    var days = d.daily.slice(0, 21).reverse();
    h += '<div class="spark">';
    for (k=0;k<days.length;k++){
      var hh = Math.max(4, Math.round((days[k].chars / max) * 64));
      h += '<span class="col" title="' + days[k].date + '：' + days[k].chars + ' 字">'
        + '<i style="height:' + hh + 'px"></i>'
        + '<em>' + days[k].date.slice(5) + '</em></span>';
    }
    h += '</div>';
  } else {
    h += '<div class="empty">还没有记录（她下次翻页就会有了）。</div>';
  }

  // ── 书架 ──
  if (d.books && d.books.length) {
    h += '<h2>书架</h2>';
    for (var s=0;s<d.books.length;s++){
      var b = d.books[s];
      h += '<div class="shelfitem">'
        + '<div class="st">《' + esc(b.title) + '》</div>'
        + '<div class="sm">' + b.chapters + ' 章 · ' + Math.round(b.chars/10000) + ' 万字'
          + (b.art ? ' · 插图 ' + b.art : '')
          + (b.reading > 0 ? ' · 在读 ' + b.reading + '%' : ' · 未开始') + '</div>'
        + '<div class="bar thin"><i style="width:' + (b.reading > 0 ? Math.max(1, b.reading) : 0) + '%"></i></div>'
        + '</div>';
    }
  }

  app.innerHTML = h;

  // 抽屉：手写高度过渡（<details> 原生展开不触发 transition）
  function setOpen(fold, open) {
    var inner = fold.querySelector('.inner');
    var cur = inner.getBoundingClientRect().height;
    if (open) {
      fold.classList.add('on');
      inner.style.height = 'auto';
      var target = inner.getBoundingClientRect().height;
      inner.style.height = cur + 'px';
      inner.offsetHeight;              // 强制回流，确认起始值
      inner.style.height = target + 'px';
      var done = function () { inner.style.height = 'auto'; inner.removeEventListener('transitionend', done); };
      inner.addEventListener('transitionend', done);
    } else {
      inner.style.height = cur + 'px';
      inner.offsetHeight;
      fold.classList.remove('on');
      inner.style.height = '0px';
    }
  }
  Array.prototype.forEach.call(document.querySelectorAll('.fold'), function (fold) {
    var hd = fold.querySelector('.hd');
    hd.addEventListener('click', function () {
      setOpen(fold, !fold.classList.contains('on'));
    });
    // 初始就是展开的，高度直接给 auto
    if (fold.classList.contains('on')) fold.querySelector('.inner').style.height = 'auto';
  });

  document.getElementById('themeBtn').addEventListener('click', function(){
    var r = document.documentElement;
    if (r.getAttribute('data-theme') === 'dark') { r.removeAttribute('data-theme'); try{localStorage.setItem('mk.theme','light');}catch(e){} }
    else { r.setAttribute('data-theme','dark'); try{localStorage.setItem('mk.theme','dark');}catch(e){} }
  });
  try {
    var saved = localStorage.getItem('mk.theme');
    if (saved === 'dark') document.documentElement.setAttribute('data-theme','dark');
    else if (saved === 'light') document.documentElement.removeAttribute('data-theme');
  } catch(e) {}
})();
</script>
</body>
</html>
