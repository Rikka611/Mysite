<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; connect-src 'self' https://naivizrdefonlelndzqr.supabase.co; img-src 'self' data:; style-src 'self' 'unsafe-inline'; object-src 'none';">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BSide Olivia Lin 分享码</title>
<style>
:root{
  --bg:#F5F6F8; --surface:#FFFFFF; --sidebar:#FBFBFC; --ink:#17191D; --muted:#5C6672; --faint:#98A1AC;
  --line:#E7E9EE; --line-strong:#D4D8DF;
  --accent:#1D5BF0; --accent-ink:#fff; --accent-soft:#EDF2FF; --accent-line:#C9D8FF;
  --gold:#B7791F; --gold-soft:#FBF3E0; --silver:#8B95A1; --bronze:#9A5B2A;
  --ok:#0E8345; --ok-soft:#E8F6EE; --danger:#C33A3A; --danger-soft:#FBEEEE; --heart:#E5385E;
  --radius:10px; --radius-sm:7px;
  --shadow-sm:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06);
  --shadow-md:0 12px 32px -14px rgba(16,24,40,.18),0 2px 6px rgba(16,24,40,.05);
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --sans:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
}
html.dark{
  --bg:#0B0C0E; --surface:#121316; --sidebar:#0E0F11; --ink:#E9EBEE; --muted:#9AA0A8; --faint:#626873;
  --line:#23262C; --line-strong:#34383F;
  --accent:#5B8DEF; --accent-ink:#0B0C0E; --accent-soft:rgba(91,141,239,.12); --accent-line:rgba(91,141,239,.4);
  --gold:#E8B34B; --gold-soft:rgba(232,179,75,.1); --silver:#B9C0C9; --bronze:#D08A5A;
  --ok:#3DD68C; --ok-soft:rgba(61,214,140,.14); --danger:#F06A6A; --danger-soft:rgba(240,106,106,.1); --heart:#F0629A;
  --shadow-sm:0 1px 0 rgba(0,0,0,.25),0 1px 3px rgba(0,0,0,.3);
  --shadow-md:0 16px 40px -16px rgba(0,0,0,.55);
  color-scheme:dark;
}
html.dark .mode-tab,html.dark .ic,html.dark .cat-badge{background:var(--surface)}
*{box-sizing:border-box;margin:0;padding:0;scrollbar-width:none;-ms-overflow-style:none}
*::-webkit-scrollbar{display:none;width:0;height:0}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* ── sidebar ── */
.sidebar{position:fixed;left:0;top:0;bottom:0;width:236px;background:var(--sidebar);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:20px 14px;z-index:40;overflow-y:auto}
.sidebar .brand{text-decoration:none;color:var(--ink);padding:4px 10px 18px;border-bottom:1px solid var(--line);margin-bottom:16px}
.sidebar .brand b{font-size:15.5px;font-weight:700;letter-spacing:-.01em;display:block}
.sidebar .brand small{font-size:10.5px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase}
.snav{display:flex;flex-direction:column;gap:2px}
.snav button{border:none;background:none;text-align:left;font:500 13.5px var(--sans);color:var(--muted);padding:8px 12px;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:9px;transition:background .15s,color .15s}
.snav button:hover{background:var(--surface);color:var(--ink)}
.snav button.active{background:var(--accent-soft);color:var(--accent)}
.slabel{margin:20px 12px 6px;font-size:10.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.cats{display:flex;flex-direction:column;gap:1px}
.cats button{border:none;background:none;text-align:left;font:500 13px var(--sans);color:var(--muted);padding:6px 12px;border-radius:7px;cursor:pointer;display:flex;align-items:center;gap:8px;transition:background .13s,color .13s}
.cats button:hover{background:var(--surface);color:var(--ink)}
.cats button.active{color:var(--accent);background:var(--accent-soft);font-weight:600}
.cats button i{font-style:normal;margin-left:auto;font:500 11px var(--mono);color:var(--faint)}
.sidebar .foot{margin-top:auto;padding:12px;font-size:10.5px;color:var(--faint);line-height:1.6;border-top:1px solid var(--line)}

/* ── main ── */
.main{margin-left:236px;min-height:100vh;display:flex;flex-direction:column}
.mbar{position:sticky;top:0;z-index:30;background:var(--surface);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:12px 22px;display:flex;align-items:center;gap:14px}
.search{flex:1;max-width:520px;display:flex;align-items:center;gap:9px;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 14px;transition:border-color .15s,box-shadow .15s}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(29,91,240,.12)}
.search svg{color:var(--faint);flex-shrink:0}
.search input{border:none;outline:none;background:none;flex:1;font:500 14px var(--sans);color:var(--ink)}
.search input::placeholder{color:var(--faint)}
input[type="search"]::-webkit-search-cancel-button,input[type="search"]::-webkit-search-decoration{-webkit-appearance:none;appearance:none;display:none}
.btn-submit{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);font:600 13px var(--sans);padding:8px 15px;border-radius:8px;cursor:pointer;transition:box-shadow .15s}
.btn-submit:hover{box-shadow:0 4px 14px -4px rgba(29,91,240,.5)}
.theme-btn{border:1px solid var(--line);background:var(--surface);color:var(--muted);width:34px;height:34px;border-radius:8px;cursor:pointer;font-size:14px;display:inline-flex;align-items:center;justify-content:center}
.theme-btn:hover{color:var(--ink);border-color:var(--line-strong)}
.theme-btn .i-sun{display:none}
html.dark .theme-btn .i-moon{display:none}
html.dark .theme-btn .i-sun{display:inline}
.snav button svg,.btn-submit svg{vertical-align:-3px;margin-right:7px}
.mode-tab svg{vertical-align:-2px;margin-right:5px}

/* ── toolbar ── */
.toolbar{display:flex;align-items:center;gap:10px;padding:16px 22px 10px;flex-wrap:wrap}
.modes{display:flex;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:3px}
.mode-tab{border:none;background:none;font:500 12.5px var(--sans);color:var(--muted);padding:6px 14px;border-radius:6px;cursor:pointer;transition:all .15s}
.mode-tab:hover{color:var(--ink)}
.mode-tab.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.toolbar .count{font-size:12.5px;color:var(--muted);margin-left:4px}
.toolbar .count b{color:var(--ink);font-weight:700}
.filter-chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--accent-line);background:var(--accent-soft);color:var(--accent);font:600 12px var(--sans);padding:5px 10px;border-radius:8px}
.filter-chip button{border:none;background:none;color:var(--accent);cursor:pointer;padding:0;display:inline-flex;opacity:.7;transition:opacity .15s}
.filter-chip button:hover{opacity:1}
.toolbar .spacer{flex:1}
.view-toggle{font:500 12px var(--sans);color:var(--muted);border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;cursor:pointer;transition:color .15s}
.view-toggle:hover{color:var(--ink)}

/* ── table view ── */
.tbl-wrap{padding:4px 22px 0;overflow-x:auto}
table.data{width:100%;border-collapse:collapse;min-width:860px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm)}
thead th{font:600 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--faint);text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);background:var(--sidebar);white-space:nowrap}
tbody td{padding:12px 14px;border-bottom:1px solid var(--line);font-size:13.5px;vertical-align:middle}
tbody tr:hover td{background:var(--accent-soft)}
tbody tr:last-child td{border-bottom:none}
td.c-rank{font:600 13px var(--mono);color:var(--faint);width:44px}
td.c-rank.r1{color:var(--gold)} td.c-rank.r2{color:var(--silver)} td.c-rank.r3{color:var(--bronze)}
td.c-title{font-weight:600;color:var(--ink);min-width:180px}
td .tagline{font-size:11.5px;color:var(--faint);margin-top:2px;font-weight:400}
td.c-cat{white-space:nowrap}
.cat-badge{display:inline-block;font-size:11.5px;font-weight:500;color:var(--accent);background:var(--accent-soft);border:1px solid var(--accent-line);padding:2px 9px;border-radius:999px}
td.c-tags .t{font-size:11.5px;color:var(--muted);background:var(--bg);border:1px solid var(--line);padding:2px 7px;border-radius:5px;margin-right:5px;white-space:nowrap}
td.c-tags .t.clickable,.ccard .tags span.clickable{cursor:pointer;font-family:inherit;transition:color .13s,background .13s,border-color .13s}
td.c-tags .t.clickable:hover,.ccard .tags span.clickable:hover{color:var(--accent);border-color:var(--accent-line);background:var(--accent-soft)}
td.c-tags .t.expand,.ccard .tags .t.expand{color:var(--accent);border-style:dashed;border-color:var(--accent-line);cursor:pointer;font-weight:600;font-family:inherit;transition:color .13s,background .13s,border-color .13s}
td.c-tags .t.expand:hover,.ccard .tags .t.expand:hover{background:var(--accent-soft)}
td.c-code{white-space:nowrap}
.code-pill{display:inline-flex;align-items:center;gap:7px;font:700 14px var(--mono);letter-spacing:.12em;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:5px 9px;cursor:pointer;transition:border-color .15s}
.code-pill:hover{border-color:var(--accent)}
.code-pill svg{color:var(--faint);width:13px;height:13px}
td.c-num{font:500 13px var(--mono);color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.c-act{white-space:nowrap;text-align:right}
.cpy{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 12.5px var(--sans);padding:6px 12px;border-radius:7px;cursor:pointer;transition:all .15s}
.cpy:hover{border-color:var(--accent);color:var(--accent)}
.cpy.done{border-color:var(--ok);color:var(--ok);background:var(--ok-soft)}
.ic{border:1px solid var(--line);background:var(--surface);color:var(--muted);width:30px;height:30px;border-radius:7px;cursor:pointer;margin-left:6px;vertical-align:middle;transition:all .15s}
.ic:hover{color:var(--accent);border-color:var(--accent-line)}
.ic.liked{color:var(--heart);border-color:rgba(229,56,94,.4);background:var(--danger-soft)}
.ic.danger:hover{color:var(--danger);border-color:#F2C9C9}

/* ── card view ── */
.cardgrid{display:none;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;padding:4px 22px}
.cardgrid.show{display:grid}
.ccard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;gap:10px;transition:box-shadow .16s,border-color .16s,transform .16s}
.ccard:hover{border-color:var(--line-strong);box-shadow:var(--shadow-md);transform:translateY(-2px)}
.ccard .cc-top{display:flex;align-items:flex-start;gap:10px}
.ccard .rank{flex-shrink:0;width:24px;height:24px;border-radius:7px;background:var(--bg);border:1px solid var(--line);color:var(--faint);font:600 11px var(--mono);display:grid;place-items:center}
.ccard .rank.r1{background:var(--gold-soft);color:var(--gold);border-color:rgba(183,121,31,.35)}
.ccard .rank.r2{color:var(--silver)} .ccard .rank.r3{color:var(--bronze)}
.ccard h3{font-size:14px;font-weight:600;letter-spacing:-.01em;line-height:1.3;flex:1}
.ccard .tags{display:flex;flex-wrap:wrap;gap:5px}
.ccard .tags span{font-size:11px;color:var(--muted);background:var(--bg);border:1px solid var(--line);padding:1px 7px;border-radius:5px}
.ccard .cc-code{display:flex;align-items:center;justify-content:space-between;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.ccard .cc-code .code{font:700 14px var(--mono);letter-spacing:.14em;color:var(--accent);cursor:pointer}
.ccard .cc-meta{display:flex;align-items:center;gap:10px;font:500 11px var(--mono);color:var(--faint);white-space:nowrap}
.ccard .cc-meta .m{display:inline-flex;align-items:center;gap:4px}
.ccard .cc-meta .m b{color:var(--muted);font-weight:500}
.ccard .cc-meta svg{flex-shrink:0}
.ccard .cc-actions{display:flex;gap:6px}
.ccard .cc-actions .cpy{flex:1;justify-content:center;padding:6px 0}

/* ── pagination ── */
.pager{display:flex;align-items:center;justify-content:center;gap:8px;padding:18px 22px 40px}
.pager button{border:1px solid var(--line);background:var(--surface);color:var(--muted);font:500 13px var(--sans);min-width:34px;height:32px;border-radius:7px;cursor:pointer;transition:all .15s}
.pager button:hover:not(:disabled){color:var(--accent);border-color:var(--accent-line)}
.pager button:disabled{opacity:.35;cursor:default}
.pager .pg-info{display:inline-flex;align-items:center;gap:4px;font:500 12.5px var(--mono);color:var(--muted)}
.pager .pg-info input{width:46px;padding:5px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--accent);font:600 12px var(--mono);text-align:center;outline:none;-moz-appearance:textfield}
.pager .pg-info input::-webkit-inner-spin-button,.pager .pg-info input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.pager .pg-info input:focus-visible{outline:2px solid var(--accent)}

/* ── discuss ── */
.discuss{display:none;width:100%;max-width:none;margin:0;padding:18px 22px 60px}
.discuss.show{display:block}
.dc-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.dc-head .modes{flex-shrink:0}
.dc-post{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dc-post .nm{position:relative;display:inline-flex;align-items:center}
.dc-post input{width:104px;padding:6px 26px 6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:12px;outline:none;font-family:inherit;transition:border-color .15s}
.dc-post input:focus{border-color:var(--accent)}
.dc-post .nm button{position:absolute;right:3px;top:50%;transform:translateY(-50%);width:20px;height:20px;border-radius:50%;border:none;background:var(--accent);color:#fff;font-size:11px;cursor:pointer;opacity:0;pointer-events:none;transition:all .3s}
.dc-post .nm button.show{opacity:1;pointer-events:auto}
.dc-post .btn-post{border:1px solid var(--line);background:var(--surface);color:var(--muted);font:600 12px var(--sans);padding:7px 13px;border-radius:8px;cursor:pointer;transition:all .15s}
.dc-post .btn-post:hover{color:var(--accent);border-color:var(--accent-line)}
.thread{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm);margin-bottom:12px;overflow:hidden}
.thread.pinned{box-shadow:inset 3px 0 0 var(--gold),var(--shadow-sm)}
.th-head{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.th-name{font-size:13px;font-weight:600;color:var(--accent)}
.th-name.admin{color:var(--gold)}
.th-time{font-size:11px;color:var(--faint);margin-left:auto}
.th-body{padding:12px 16px}
.th-title{font-size:14.5px;font-weight:700;color:var(--ink);margin-bottom:4px}
.th-content{font-size:13px;color:var(--muted);white-space:pre-wrap;word-break:break-word;line-height:1.6}
.th-foot{display:flex;gap:6px;padding:8px 16px 12px}
.th-btn{font-size:11.5px;color:var(--muted);cursor:pointer;background:var(--surface);border:1px solid var(--line);padding:5px 11px;border-radius:7px;font-family:inherit;transition:all .15s}
.th-btn:hover{color:var(--accent);border-color:var(--accent-line)}
.replies{margin:4px 12px 12px;padding:8px 0 8px 14px;border-left:2px solid var(--line);max-height:600px;overflow:hidden;transition:max-height .35s,opacity .3s}
.replies.collapsed{max-height:0;padding-top:0;padding-bottom:0;opacity:0}
.reply-item{padding:8px 10px;margin:3px 0;border-radius:8px;background:var(--bg);font-size:12.5px}
.reply-item .th-name{font-size:12px}
.reply-item .th-content{color:var(--ink);margin-top:2px}
.reply-form{display:flex;gap:6px;margin-top:10px}
.reply-form input{flex:1;padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:12.5px;outline:none;font-family:inherit;transition:border-color .15s}
.reply-form input:focus{border-color:var(--accent)}
.reply-form input:focus-visible{outline:2px solid var(--accent)}
.reply-form button{border:none;background:var(--accent);color:#fff;font:600 12px var(--sans);padding:7px 16px;border-radius:8px;cursor:pointer;transition:filter .15s}
.reply-form button:hover{filter:brightness(1.08)}
.discuss-empty{text-align:center;padding:50px 0;color:var(--faint)}

/* ── 我的提交 + 待收录榜 ── */
.st-badge{display:inline-flex;align-items:center;font:600 11px var(--sans);padding:3px 9px;border-radius:6px;white-space:nowrap}
.st-badge.pending{color:var(--warn);background:var(--warn-soft)}
.st-badge.approved{color:var(--ok);background:var(--ok-soft)}
.st-badge.rejected{color:var(--faint);background:var(--bg)}
.mine-row,.req-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;box-shadow:var(--shadow-sm);animation:rowIn .25s ease-out both}
.mine-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.mine-row .m-code{font:700 15px var(--mono);letter-spacing:.12em;color:var(--accent);cursor:pointer;flex-shrink:0}
.mine-row .m-title{font-size:14px;font-weight:600;flex:1;min-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mine-row .m-time{font-size:11px;color:var(--faint);flex-shrink:0}
.mine-row .m-act{flex-shrink:0}
.req-form{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:14px;display:flex;gap:8px;flex-wrap:wrap}
.req-form input{flex:1;min-width:140px;padding:8px 11px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:13px;outline:none;font-family:inherit;transition:border-color .15s}
.req-form input:focus{border-color:var(--accent)}
.req-form button{border:none;background:var(--accent);color:#fff;font:600 12.5px var(--sans);padding:8px 18px;border-radius:8px;cursor:pointer;transition:filter .15s}
.req-form button:hover{filter:brightness(1.06)}
.req-tabs{display:flex;gap:6px;margin-bottom:12px}
.req-tabs button{border:1px solid var(--line);background:var(--surface);color:var(--muted);font:500 12px var(--sans);padding:5px 12px;border-radius:7px;cursor:pointer;transition:all .13s}
.req-tabs button:hover{color:var(--ink)}
.req-tabs button.active{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.req-card .req-top{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.req-card .req-title{font-size:14.5px;font-weight:600;flex:1;min-width:0}
.req-card .req-note{font-size:12.5px;color:var(--muted);margin-bottom:8px}
.req-card .req-meta{display:flex;align-items:center;gap:12px;font-size:11.5px;color:var(--faint)}
.req-card .req-votes{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:6px;padding:3px 10px;cursor:pointer;font-size:12px;color:var(--muted);transition:all .13s}
.req-card .req-votes:hover{color:var(--accent);border-color:var(--accent-line)}
.req-card .req-votes.voted{color:var(--accent);border-color:var(--accent-line);background:var(--accent-soft)}
.req-card .req-status{margin-left:auto;font-size:11px}
.req-card .req-status.open{color:var(--warn)}
.req-card .req-status.done{color:var(--ok)}
/* 讨论视图：隐藏分享码搜索/工具条/侧栏分类 */
body.view-discuss .search,body.view-discuss #openModalBtn,body.view-discuss .toolbar{display:none}
body.view-discuss .sidebar .slabel,body.view-discuss .sidebar .cats{display:none}
.discuss-form input,.discuss-form textarea{width:100%;padding:8px 11px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:13px;outline:none;font-family:inherit;margin-bottom:8px;resize:vertical}
.discuss-form input:focus,.discuss-form textarea:focus{border-color:var(--accent)}

/* ── modal ── */
.overlay{position:fixed;inset:0;z-index:200;display:none;background:rgba(0,0,0,.5);backdrop-filter:blur(3px);align-items:center;justify-content:center}
.overlay.show{display:flex}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:26px;width:430px;max-width:92vw;max-height:86vh;overflow-y:auto;box-shadow:var(--shadow-md)}
.modal h3{font-size:16px;font-weight:700;color:var(--ink);text-align:center;margin-bottom:4px}
.modal .m-sub{font-size:12px;color:var(--faint);text-align:center;margin-bottom:14px}
.modal label{display:block;font-size:12px;color:var(--muted);margin:12px 0 5px}
.modal label b{color:var(--danger);font-weight:600}
.modal input,.modal textarea{width:100%;padding:9px 12px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:13.5px;outline:none;font-family:inherit;resize:vertical}
.modal input:focus-visible,.modal textarea:focus-visible{outline:2px solid var(--accent)}
.modal textarea{min-height:60px}
.major{display:flex;flex-wrap:wrap;gap:5px}
.major .mcat{border:1px solid var(--line);background:var(--surface);color:var(--muted);font:500 12px var(--sans);padding:5px 11px;border-radius:50px;cursor:pointer;transition:all .15s}
.major .mcat.active{background:var(--accent);border-color:var(--accent);color:#fff}
.modal .err{color:var(--danger);font-size:12.5px;text-align:center;margin-top:8px;min-height:18px}
.modal .m-btns{display:flex;gap:8px;margin-top:16px;justify-content:center}
.modal .m-btns button{border-radius:8px;font:600 13px var(--sans);padding:9px 26px;cursor:pointer}
.m-cancel{border:1px solid var(--line);background:var(--surface);color:var(--muted)}
.m-ok{border:none;background:var(--accent);color:#fff}

/* ── toast / footer / empty ── */
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,14px);background:var(--ink);color:#fff;font:600 13px var(--sans);padding:10px 18px;border-radius:9px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;box-shadow:var(--shadow-md);z-index:300}
.toast.show{opacity:1;transform:translate(-50%,0)}
@keyframes fly{from{opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(.4);opacity:0}}
footer{margin:0 22px 30px;padding-top:20px;border-top:1px solid var(--line);color:var(--faint);font-size:11.5px;line-height:1.7}
.empty{grid-column:1/-1;text-align:center;padding:50px 0;color:var(--faint)}
.empty b{display:block;color:var(--muted);margin-bottom:4px}
.empty .retry{margin-top:12px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font:600 12.5px var(--sans);padding:7px 18px;border-radius:8px;cursor:pointer;transition:all .15s}
.empty .retry:hover{color:var(--accent);border-color:var(--accent-line)}

/* ── 打磨：骨架屏 / 行入场 / 按压 / 弹窗 / 搜索清除 / 排序 ── */
.skeleton-row td{height:56px;position:relative;overflow:hidden}
.skeleton-row td::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(128,140,160,.09),transparent);animation:shimmer 1.3s ease-in-out infinite}
.skeleton-row td:first-child::before{content:'';position:absolute;left:14px;top:50%;width:34px;height:10px;transform:translateY(-50%);border-radius:5px;background:var(--line);opacity:.6}
.skeleton-row td:nth-child(2)::before{content:'';position:absolute;left:14px;top:50%;width:120px;height:10px;transform:translateY(-50%);border-radius:5px;background:var(--line);opacity:.6}
@keyframes shimmer{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
tbody tr.data-row{animation:rowIn .28s ease-out both}
@keyframes rowIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.ic:active,.cpy:active,.mode-tab:active,.view-toggle:active,.btn-submit:active{transform:scale(.95)}
.mode-tab,.cpy,.ic,.view-toggle,.btn-submit,.retry{transition:background .15s,color .15s,border-color .15s,box-shadow .15s,transform .05s}
.overlay{animation:none}
.overlay.show .modal{animation:modalIn .22s cubic-bezier(.25,.8,.25,1) both}
@keyframes modalIn{from{opacity:0;transform:scale(.96) translateY(8px)}to{opacity:1;transform:scale(1) translateY(0)}}
.search{position:relative}
.search .clear{display:none;border:none;background:none;color:var(--faint);cursor:pointer;padding:4px;border-radius:50%;flex-shrink:0}
.search .clear:hover{color:var(--ink);background:var(--line)}
.search.has-text .clear{display:inline-flex}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--ink)}
th.sortable .arr{display:inline-block;margin-left:3px;color:var(--accent);font-weight:700;width:10px}
th.sortable .arr.dim{color:var(--faint);font-weight:400}
.code-pill.done{border-color:var(--ok);color:var(--ok)}
.code-pill.done svg{color:var(--ok)}
.discuss .mode-tab,.discuss .btn-post{transition:background .15s,color .15s,border-color .15s}
.th-btn svg{vertical-align:-2px;margin-right:3px}
.ccard{animation:rowIn .3s ease-out both}

@media(max-width:920px){
  .sidebar{position:static;width:100%;flex-direction:row;flex-wrap:wrap;align-items:center;padding:12px 14px;border-right:none;border-bottom:1px solid var(--line);gap:8px}
  .sidebar .brand{border:none;padding:0;margin:0;margin-right:12px}
  .snav{flex-direction:row}
  .slabel{display:none}
  .cats{flex-direction:row;flex-wrap:wrap;order:10;width:100%;margin-top:6px}
  .sidebar .foot{display:none}
  .main{margin-left:0}
  .mbar{padding:10px 14px}
  .toolbar{padding:12px 14px 8px}
  .tbl-wrap{padding:0 14px}
  .pager{padding:14px}
  .cardgrid{padding:0 14px}
  footer{margin:0 14px 24px}
  .discuss{padding:14px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}
</style>
</head>

var BROAD=[["game","游戏",1],["anime","动漫",0],["anime","番剧",0],["acg","acg",0],["pop_cn","流行",0],["classical","古典",0],["vocaloid","术力口",0],["vocaloid","vocaloid",0],["kpop","kpop",0]];
function classify(tags,title){
  var s=((tags||"")+" "+(title||"")).toLowerCase();
  for(var i=0;i<SPEC_ORDER.length;i++){var id=SPEC_ORDER[i];var k=SPEC[id]||[];for(var j=0;j<k.length;j++){if(k[j].length>=2&&s.indexOf(k[j].toLowerCase())>=0)return id}}
  var toks=(tags||"").toLowerCase().split(/[\s,]+/);
  for(var b=0;b<BROAD.length;b++){if(BROAD[b][2]){if(toks.indexOf(BROAD[b][1])>=0)return BROAD[b][0]}else{if((tags||"").toLowerCase().indexOf(BROAD[b][1])>=0)return BROAD[b][0]}}
  return "other";
}

var _renderSeq=0,hSort=null,hDir=-1;
async function render(skipAnim){
  var seq=++_renderSeq;
  var rows=document.getElementById('rows'),grid=document.getElementById('cardgrid'),countEl=document.getElementById('count');
  var skel='';for(var s=0;s<6;s++){skel+='<tr class="skeleton-row"><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>'}
  rows.innerHTML=skel;grid.innerHTML='';
  try{
    var data;
    if(tab==='search'){var q=document.getElementById('searchInput').value.trim();if(!q){countEl.textContent='0';rows.innerHTML='<tr><td colspan="8" class="empty"><b>输入关键词搜索</b>在搜索框输入曲名、作者或标签</td></tr>';return}data=await searchCodes(encodeURIComponent(q))}
    else if(tab==='category'&&activeCat){var all=await getFull();if(seq!==_renderSeq)return;data=all.filter(function(x){return classify(x.tags,x.title)===activeCat})}
    else{data=await getFull();if(tab==='new'){data=data.slice().sort(function(a,b){return new Date(b.created_at)-new Date(a.created_at)})}}
    if(seq!==_renderSeq)return;
    if(hSort&&data.length){data=data.slice().sort(function(a,b){return ((a[hSort]||0)-(b[hSort]||0))*hDir})}
    if(tagFilter&&data.length){data=data.filter(function(x){return (x.tags||'').toLowerCase().indexOf(tagFilter.toLowerCase())>=0})}
    if(!data.length){countEl.textContent='0';rows.innerHTML='<tr><td colspan="8" class="empty"><b>暂无分享码</b>点右上角「提交分享码」收录第一首吧</td></tr>';document.getElementById('pager').innerHTML='';return}
    totalPages=Math.ceil(data.length/pageSize);if(page>totalPages)page=totalPages;
    var slice=data.slice((page-1)*pageSize,page*pageSize);
    countEl.textContent=data.length;
    rows.innerHTML=slice.map(function(item,i){return buildRow(item,(page-1)*pageSize+i)}).join('');
    grid.innerHTML=slice.map(function(item,i){return buildCard(item,(page-1)*pageSize+i)}).join('');
    slice.forEach(function(item){trackView(item.id)});
    renderPager(page,totalPages);
  }catch(e){if(seq===_renderSeq){countEl.textContent='0';rows.innerHTML='<tr><td colspan="8" class="empty"><b>加载失败</b>请检查网络后重试<br><button class="retry" onclick="render()">重试</button></td></tr>'}}
}

}

// ====== 讨论区 ======
var threads=[],discussLiked=JSON.parse(localStorage.getItem('linli_discuss_liked')||'[]'),discussTab='hot',_myName=localStorage.getItem('linli_myname')||'';
function switchDiscussTab(t){discussTab=t;document.querySelectorAll('#discussTabHot,#discussTabNew').forEach(function(b){b.classList.toggle('active',(b.id==='discussTabHot'&&t==='hot')||(b.id==='discussTabNew'&&t==='new'))});renderThreads()}
document.getElementById('discussTabHot').addEventListener('click',function(){switchDiscussTab('hot')});
document.getElementById('discussTabNew').addEventListener('click',function(){switchDiscussTab('new')});
function hotScore(t){var now=Date.now(),postHours=(now-new Date(t.created_at).getTime())/3600000,latestReply=0;if(t._replies&&t._replies.length){t._replies.forEach(function(r){var rt=new Date(r.created_at).getTime();if(rt>latestReply)latestReply=rt})}var replyHours=(now-latestReply)/3600000,likeScore=(t.likes||0)/Math.pow(postHours+2,2),replyScore=(t._replies?t._replies.length:0)/Math.pow(replyHours+1,1.2);return likeScore+replyScore+Math.random()*2}
function fmtTime(ts){if(!ts)return'';var d=new Date(ts),now=new Date(),diffM=Math.floor((now-d)/60000);if(diffM<10)return diffM<=0?'刚刚':diffM+'分钟前';if(d.toDateString()===now.toDateString())return d.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});return d.getFullYear()+'-'+(d.getMonth()+1).toString().padStart(2,'0')+'-'+d.getDate().toString().padStart(2,'0')}
function togglePostForm(){var f=document.getElementById('postForm');f.style.display=f.style.display==='none'?'':'none';document.getElementById('togglePostBtn').textContent=f.style.display==='none'?'＋ 发帖':'－ 收起';if(f.style.display!=='none')document.getElementById('newTitle').focus()}
document.getElementById('newName').value=_myName;
function onNameInput(){var v=document.getElementById('newName').value.trim(),btn=document.getElementById('nameConfirmBtn');btn.classList.toggle('show',!!v&&v!==_myName)}
async function confirmName(){var v=document.getElementById('newName').value.trim();if(!v||v===_myName)return;var old=_myName;_myName=v;localStorage.setItem('linli_myname',v);document.getElementById('nameConfirmBtn').classList.remove('show');var all=[];threads.forEach(function(t){all.push(t);if(t._replies)t._replies.forEach(function(r){all.push(r)})});var toUpdate=all.filter(function(x){return x.name===old});for(var i=0;i<toUpdate.length;i++){try{await sbApi('discussions?id=eq.'+toUpdate[i].id,{method:'PATCH',body:JSON.stringify({name:v})})}catch(e){};toUpdate[i].name=v}renderThreads()}
async function loadThreads(){try{var data=await sbApi('discussions?select=*&parent_id=is.null&order=created_at.desc&limit=100'),replies=await sbApi('discussions?select=*&parent_id=not.is.null&order=created_at.asc&limit=500');threads=data.map(function(t){t._replies=replies.filter(function(r){return r.parent_id===t.id});return t});renderThreads()}catch(e){document.getElementById('discussEmpty').textContent='加载失败'}}
function renderThreads(){
  var list=document.getElementById('threadList'),empty=document.getElementById('discussEmpty');
  threads.sort(function(a,b){if(b.pinned!==a.pinned)return(b.pinned?1:0)-(a.pinned?1:0);if(discussTab==='new')return new Date(b.created_at)-new Date(a.created_at);return hotScore(b)-hotScore(a)});
  if(!threads.length){list.innerHTML='';empty.style.display='';empty.textContent='暂无讨论，来发第一个帖子吧';return}empty.style.display='none';
  list.innerHTML=threads.map(function(t){
    var hasAdminReply=t._replies.some(function(r){return r.is_admin}),nameHtml=t.is_admin?'<span class="th-name admin">Admin</span>':'<span class="th-name">'+esc(t.name||'匿名用户')+'</span>',pinBadge=t.pinned?svg('pin',12)+' ':'';
    return '<div class="thread'+(t.pinned?' pinned':'')+'">'+
      '<div class="th-head">'+pinBadge+nameHtml+'<span class="th-time">'+fmtTime(t.created_at)+'</span></div>'+
      '<div class="th-body">'+(t.title?'<div class="th-title">'+esc(t.title)+'</div>':'')+'<div class="th-content">'+esc(t.content)+'</div></div>'+
      '<div class="th-foot"><button class="th-btn" onclick="doDiscussLike('+t.id+')">'+heartSvg(discussLiked.indexOf(t.id)>=0)+' '+(t.likes||0)+'</button><button class="th-btn" onclick="reportDiscuss('+t.id+')">'+svg('alert',12)+'</button><button class="th-btn" onclick="toggleReplies('+t.id+')">'+svg('comment',12)+' '+(t._replies.length?t._replies.length+' 回复':'回复')+'</button></div>'+
      '<div class="replies'+(hasAdminReply?'':' collapsed')+'" id="replies-'+t.id+'">'+
        (t._replies.length?t._replies.map(function(r){return '<div class="reply-item">'+(r.is_admin?'<span class="th-name admin">Admin</span>':'<span class="th-name">'+esc(r.name||'匿名用户')+'</span>')+'<span class="th-time">'+fmtTime(r.created_at)+'</span><div class="th-content">'+esc(r.content)+'</div></div>'}).join(''):'<div style="font-size:11.5px;color:var(--faint);padding:4px 0">暂无回复</div>')+
        '<div class="reply-form"><input id="replyContent-'+t.id+'" placeholder="回复…" maxlength="300" aria-label="回复" onkeydown="if(event.key===\'Enter\')postReply('+t.id+')"><button onclick="postReply('+t.id+')">回复</button></div>'+
      '</div></div>';
  }).join('')}
function toggleReplies(id){var div=document.getElementById('replies-'+id);div.classList.toggle('collapsed');if(!div.classList.contains('collapsed')){var inp=document.getElementById('replyContent-'+id);if(inp)inp.focus()}}
async function postReply(id){var c=document.getElementById('replyContent-'+id).value.trim();if(!c)return;try{await sbApi('discussions',{method:'POST',body:JSON.stringify({name:_myName||'匿名用户',content:c,parent_id:id})});showToast('回复成功');await loadThreads()}catch(e){showToast('回复失败')}}
async function postTopic(){var title=document.getElementById('newTitle').value.trim(),content=document.getElementById('newContent').value.trim();if(!title||!content){showToast('请填写标题和内容');return};var nn=_myName||'匿名用户';if(nn!=='匿名用户'&&threads.some(function(t){return t.name===nn})){showToast('昵称已被使用，请换一个');return};try{await sbApi('discussions',{method:'POST',body:JSON.stringify({name:nn,content:content,title:title})});showToast('发布成功');document.getElementById('newTitle').value='';document.getElementById('newContent').value='';togglePostForm();await loadThreads()}catch(e){showToast('发布失败')}}
async function doDiscussLike(id){var idx=discussLiked.indexOf(id),isLiked=idx>=0;if(isLiked)discussLiked.splice(idx,1);else discussLiked.push(id);localStorage.setItem('linli_discuss_liked',JSON.stringify(discussLiked));var t=threads.find(function(x){return x.id===id}),n=(t?t.likes||0:0)+(isLiked?-1:1);try{await sbApi('discussions?id=eq.'+id,{method:'PATCH',body:JSON.stringify({likes:Math.max(0,n)})})}catch(e){}loadThreads()}
async function reportDiscuss(id){try{var d=await sbApi('discussions?select=reports&id=eq.'+id),n=(d[0]?.reports||0)+1;await sbApi('discussions?id=eq.'+id,{method:'PATCH',body:JSON.stringify({reports:n})});showToast('已举报')}catch(e){showToast('举报失败')}}

// ====== 我的提交 ======
function openSubmit(){document.getElementById('openModalBtn').click()}
var _editId=0,_editToken='';
function openEdit(id){
  var subs=[];try{subs=JSON.parse(localStorage.getItem('linli_my_subs')||'[]')}catch(e){}
  var s=subs.find(function(x){return x.id===id});
  if(!s){showToast('未找到该提交');return}
  if(!s.token){showToast('该提交没有编辑令牌，无法编辑');return}
  _editId=id;_editToken=s.token;
  document.getElementById('editTitle').value=s.title||'';
  document.getElementById('editCode').value=s.code||'';
  document.getElementById('editTags').value='';
  document.getElementById('editReason').value='';
  document.getElementById('editError').textContent='';
  document.getElementById('editOverlay').classList.add('show');
  document.getElementById('editTitle').focus();
}
function closeEdit(){document.getElementById('editOverlay').classList.remove('show');_editId=0;_editToken=''}
async function saveEdit(){
  var title=document.getElementById('editTitle').value.trim(),code=document.getElementById('editCode').value.trim().toUpperCase(),tags=document.getElementById('editTags').value.trim(),reason=document.getElementById('editReason').value.trim(),err=document.getElementById('editError');
  if(!title||title.length>50){err.textContent='歌名不能为空且不超过50字';return}
  if(!/^[A-Za-z0-9]{6}$/.test(code)){err.textContent='请输入六位分享码（字母或数字）';return}
  if(!reason){err.textContent='请填写编辑理由';return}
  try{
    var ok=await sbApi('rpc/submit_edit',{method:'POST',body:JSON.stringify({item_id:_editId,token:_editToken,title:title,tags:tags,code:code,reason:reason})});
    if(ok===false||ok===null){err.textContent='提交失败：令牌无效、记录不存在或已有待审编辑';return}
    var subs=[];try{subs=JSON.parse(localStorage.getItem('linli_my_subs')||'[]')}catch(e){}
    subs.forEach(function(s){if(s.id===_editId){s.editPending=true}});
    localStorage.setItem('linli_my_subs',JSON.stringify(subs));
    closeEdit();showToast('已提交编辑，等待管理员审核');loadMine();
  }catch(e){err.textContent='提交失败，请重试'}
}
function loadMine(){
  var subs=[];try{subs=JSON.parse(localStorage.getItem('linli_my_subs')||'[]')}catch(e){}
  var list=document.getElementById('mineList'),empty=document.getElementById('mineEmpty');
  if(!subs.length){list.innerHTML='';empty.style.display='';empty.textContent='你还没有提交过分享码，点「提交分享码」收录第一首吧';return}
  empty.style.display='none';
  list.innerHTML=subs.map(function(s){return '<div class="mine-row"><span class="st-badge pending">待审核</span>'+(s.editPending?'<span class="st-badge" style="background:var(--accent-soft);color:var(--accent)">编辑审核中</span>':'')+'<span class="m-code" onclick="copyCode(\''+esc(s.code)+'\')">'+esc(s.code)+'</span><span class="m-title">'+esc(s.title||'')+'</span><span class="m-time">'+new Date(s.ts).toLocaleString('zh-CN')+'</span><span class="m-act"><button class="cpy" onclick="copyCode(\''+esc(s.code)+'\')">'+svg('copy',12)+'复制</button>'+(s.editPending?'':'<button class="btn sm" onclick="openEdit('+s.id+')">编辑</button>')+'</span></div>'}).join('');
  var ids=subs.map(function(s){return s.id});if(!ids.length)return;
  sbApi('linli_codes?select=id,code,title,status,created_at&id=in.('+ids.join(',')+')').then(function(rows){
    if(!rows||!rows.length)return;
    var stMap={pending:'<span class="st-badge pending">待审核</span>',approved:'<span class="st-badge approved">已通过</span>',rejected:'<span class="st-badge rejected">已拒绝</span>'};
    list.innerHTML=rows.map(function(r){var ts=subs.find(function(s){return s.id===r.id});return '<div class="mine-row">'+(stMap[r.status]||'<span class="st-badge">'+esc(r.status)+'</span>')+(ts&&ts.editPending?'<span class="st-badge" style="background:var(--accent-soft);color:var(--accent)">编辑审核中</span>':'')+'<span class="m-code" onclick="copyCode(\''+esc(r.code)+'\')">'+esc(r.code)+'</span><span class="m-title">'+esc(r.title||'')+'</span><span class="m-time">'+(ts?new Date(ts.ts).toLocaleString('zh-CN'):'')+'</span><span class="m-act"><button class="cpy" onclick="copyCode(\''+esc(r.code)+'\')">'+svg('copy',12)+'复制</button>'+(ts&&ts.editPending?'':'<button class="btn sm" onclick="openEdit('+r.id+')">编辑</button>')+'</span></div>'}).join('');
  }).catch(function(){});
}

// ====== 待收录榜 ======
var reqSort='hot';
function loadRequests(){
  var list=document.getElementById('reqList'),empty=document.getElementById('reqEmpty');
  empty.style.display='none';list.innerHTML='<div style="color:var(--faint);font-size:12px;padding:10px 0">加载中…</div>';
  sbApi('requests?select=*&order=votes.desc&limit=200').then(function(rows){
    if(!rows||!rows.length){list.innerHTML='';empty.style.display='';empty.textContent='还没有人求谱，来点第一首吧';return}
    var arr=rows.slice();
    if(reqSort==='new')arr.sort(function(a,b){return new Date(b.created_at)-new Date(a.created_at)});
    else arr.sort(function(a,b){return (b.votes||0)-(a.votes||0)});
    var voted=[];try{voted=JSON.parse(localStorage.getItem('linli_req_voted')||'[]')}catch(e){}
    list.innerHTML=arr.map(function(r){
      var isVoted=voted.indexOf(r.id)>=0;
      return '<div class="req-card"><div class="req-top"><span class="req-title">'+esc(r.title)+'</span><span class="req-status '+(r.status==='done'?'done':'open')+'">'+(r.status==='done'?'已收录':'待收录')+'</span></div>'+
        (r.note?'<div class="req-note">'+esc(r.note)+'</div>':'')+
        '<div class="req-meta"><button class="req-votes'+(isVoted?' voted':'')+'" onclick="upvoteRequest('+r.id+')" aria-label="求谱 +1">'+svg('heart',12)+' '+(r.votes||0)+'</button><span>'+new Date(r.created_at).toLocaleDateString('zh-CN')+'</span></div></div>';
    }).join('');
  }).catch(function(){list.innerHTML='';empty.style.display='';empty.textContent='待收录加载失败，请稍后重试'});
}
function setReqSort(s){reqSort=s;document.querySelectorAll('#reqTabs button').forEach(function(b){b.classList.toggle('active',b.textContent===(s==='hot'?'最热':'最新'))});loadRequests()}
async function addRequest(){
  var title=document.getElementById('reqTitle').value.trim(),note=document.getElementById('reqNote').value.trim();
  if(!title){showToast('请输入想弹的曲名');return}
  if(title.length>60){showToast('曲名最多 60 字');return}
  try{await sbApi('requests',{method:'POST',body:JSON.stringify({title:title,note:note,votes:0,status:'open'})});document.getElementById('reqTitle').value='';document.getElementById('reqNote').value='';showToast('求谱成功，坐等收录');loadRequests()}catch(e){showToast('求谱失败：待收录榜尚未开启')}
}
async function upvoteRequest(id){
  var voted=[];try{voted=JSON.parse(localStorage.getItem('linli_req_voted')||'[]')}catch(e){}
  if(voted.indexOf(id)>=0){showToast('已求过这首');return}
  voted.push(id);localStorage.setItem('linli_req_voted',JSON.stringify(voted));
  try{var d=await sbApi('requests?select=votes&id=eq.'+id);var n=(d[0]?.votes||0)+1;await sbApi('requests?id=eq.'+id,{method:'PATCH',body:JSON.stringify({votes:n})});loadRequests()}catch(e){}
}

// ====== 访问统计 + 初始化 ======
(async function(){if(sessionStorage.getItem('pv_counted'))return;sessionStorage.setItem('pv_counted','1');try{await sbApi('page_visits',{method:'POST',body:JSON.stringify({page:'linli'})})}catch(e){}})();
applyView();
buildCatList();
updateCatCounts();
if(mainView==='discuss'||mainView==='mine'||mainView==='requests'){switchMainView(mainView)}else{if((tab==='category'&&!activeCat)||tab==='search'){tab='hot';sessionStorage.setItem('linli_tab','hot')}setMode(tab)}
</script>
