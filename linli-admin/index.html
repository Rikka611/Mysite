<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; connect-src 'self' https://naivizrdefonlelndzqr.supabase.co; img-src 'self' data:; style-src 'self' 'unsafe-inline'; object-src 'none';">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BSide Olivia Lin · 管理台</title>
<style>
:root{
  --bg:#F5F6F8; --surface:#FFFFFF; --sidebar:#FBFBFC; --ink:#17191D; --muted:#5C6672; --faint:#98A1AC;
  --line:#E7E9EE; --line-strong:#D4D8DF;
  --accent:#1D5BF0; --accent-ink:#fff; --accent-soft:#EDF2FF; --accent-line:#C9D8FF;
  --ok:#0E8345; --ok-soft:#E8F6EE; --warn:#B7791F; --warn-soft:#FBF3E0; --danger:#C33A3A; --danger-soft:#FBEEEE;
  --radius:10px; --radius-sm:7px;
  --shadow-sm:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06);
  --shadow-md:0 12px 32px -14px rgba(16,24,40,.18),0 2px 6px rgba(16,24,40,.05);
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --sans:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
}
html.dark{
  --bg:#0B0C0E; --surface:#121316; --sidebar:#0E0F11; --ink:#E9EBEE; --muted:#9AA0A8; --faint:#626873;
  --line:#23262C; --line-strong:#34383F;
  --accent:#5B8DEF; --accent-ink:#0B0C0E; --accent-soft:rgba(91,141,239,.12); --accent-line:rgba(91,141,239,.4);
  --ok:#3DD68C; --ok-soft:rgba(61,214,140,.14); --warn:#E8B34B; --warn-soft:rgba(232,179,75,.1); --danger:#F06A6A; --danger-soft:rgba(240,106,106,.1);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0;scrollbar-width:none;-ms-overflow-style:none}
*::-webkit-scrollbar{display:none;width:0;height:0}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* ── login ── */
.login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.login-card{width:380px;max-width:92vw;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:32px 30px;box-shadow:var(--shadow-md)}
.login-card .brand{font-size:19px;font-weight:700;letter-spacing:-.01em;text-align:center;margin-bottom:4px}
.login-card .brand small{display:block;font-size:10.5px;color:var(--faint);letter-spacing:.14em;text-transform:uppercase;margin-top:2px;font-weight:500}
.login-card .step{display:flex;gap:6px;margin:20px 0 16px}
.login-card .step i{flex:1;height:3px;border-radius:3px;background:var(--line)}
.login-card .step i.on{background:var(--accent)}
.login-card input{width:100%;padding:10px 14px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:14px;outline:none;font-family:inherit;margin-bottom:10px;text-align:center;transition:border-color .15s}
.login-card input:focus{border-color:var(--accent)}
.login-card button{width:100%;border:none;background:var(--accent);color:#fff;font:600 14px var(--sans);padding:11px 0;border-radius:9px;cursor:pointer;transition:filter .15s,transform .05s}
.login-card button:hover{filter:brightness(1.06)}
.login-card button:active{transform:scale(.98)}
.login-card .err{color:var(--danger);font-size:12.5px;text-align:center;margin-top:10px;min-height:18px}

/* ── app layout ── */
.app{display:flex;min-height:100vh}
.sidebar{width:224px;flex-shrink:0;background:var(--sidebar);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 12px;position:sticky;top:0;height:100vh;overflow-y:auto}
.sidebar .brand{text-decoration:none;color:var(--ink);padding:4px 10px 16px;border-bottom:1px solid var(--line);margin-bottom:14px;display:block}
.sidebar .brand b{font-size:15px;font-weight:700;letter-spacing:-.01em;display:block}
.sidebar .brand small{font-size:10px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase}
.slabel{margin:14px 10px 5px;font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.snav{display:flex;flex-direction:column;gap:1px}
.snav button{border:none;background:none;text-align:left;font:500 13px var(--sans);color:var(--muted);padding:8px 10px;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:9px;transition:background .13s,color .13s}
.snav button:hover{background:var(--surface);color:var(--ink)}
.snav button.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.snav button svg{flex-shrink:0}
.snav button em{font-style:normal;margin-left:auto;font:500 11px var(--mono);color:var(--faint);background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:0 7px}
.snav button.active em{color:var(--accent);border-color:var(--accent-line);background:var(--surface)}
.sidebar .foot{margin-top:auto;padding:12px 10px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.sidebar .foot .btn{width:100%}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.mbar{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--line);padding:11px 20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.search{flex:1;min-width:200px;max-width:460px;display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 12px;transition:border-color .15s,box-shadow .15s}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(29,91,240,.12)}
.search svg{color:var(--faint);flex-shrink:0}
.search input{border:none;outline:none;background:none;flex:1;font:500 13.5px var(--sans);color:var(--ink)}
.search input::placeholder{color:var(--faint)}
.mbar select{border:1px solid var(--line);background:var(--bg);color:var(--ink);font:500 12.5px var(--sans);padding:8px 10px;border-radius:8px;outline:none;cursor:pointer}
.mbar .spacer{flex:1}
.theme-btn{border:1px solid var(--line);background:var(--surface);color:var(--muted);width:34px;height:34px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.theme-btn:hover{color:var(--ink);border-color:var(--line-strong)}
.theme-btn .i-sun{display:none}
html.dark .theme-btn .i-moon{display:none}
html.dark .theme-btn .i-sun{display:inline}

.content{padding:16px 20px 60px;flex:1}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--muted);font:600 12.5px var(--sans);padding:8px 14px;border-radius:8px;cursor:pointer;transition:all .15s;white-space:nowrap}
.btn:hover{color:var(--ink);border-color:var(--line-strong)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ok{color:var(--ok);border-color:rgba(14,131,69,.35)}
.btn.ok:hover{background:var(--ok-soft);border-color:var(--ok)}
.btn.warn{color:var(--warn);border-color:rgba(183,121,31,.35)}
.btn.warn:hover{background:var(--warn-soft);border-color:var(--warn)}
.btn.danger{color:var(--danger);border-color:rgba(195,58,58,.35)}
.btn.danger:hover{background:var(--danger-soft);border-color:var(--danger)}
.btn.sm{padding:5px 11px;font-size:12px}
.bulk{display:flex;gap:6px;flex-wrap:wrap}
.bulk .btn{padding:7px 12px;font-size:12px}

/* ── table ── */
.tbl-wrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm);overflow-x:auto}
table.data{width:100%;border-collapse:collapse;min-width:880px}
thead th{font:600 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--faint);text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);background:var(--sidebar);white-space:nowrap}
tbody td{padding:11px 14px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--accent-soft)}
tbody tr{animation:rowIn .25s ease-out both}
@keyframes rowIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.st{display:inline-flex;align-items:center;gap:5px;font:600 11px var(--sans);padding:3px 9px;border-radius:6px;white-space:nowrap}
.st.pending{color:var(--warn);background:var(--warn-soft)}
.st.approved{color:var(--ok);background:var(--ok-soft)}
.st.rejected{color:var(--faint);background:var(--bg)}
.st.reported{color:var(--danger);background:var(--danger-soft)}
td.c-code{white-space:nowrap}
.code{font:700 14px var(--mono);letter-spacing:.12em;color:var(--accent)}
.dupe-tag{display:inline-block;margin-left:6px;background:var(--danger);color:#fff;font-size:10px;padding:1px 6px;border-radius:4px;vertical-align:2px}
td.c-title{font-weight:600;min-width:160px}
td .sub{font-size:11.5px;color:var(--faint);font-weight:400;margin-top:2px}
td.c-tags .t{display:inline-block;font-size:11px;color:var(--muted);background:var(--bg);border:1px solid var(--line);padding:1px 7px;border-radius:5px;margin-right:4px;white-space:nowrap}
.tag-edit{cursor:pointer;color:var(--accent);font-size:11px;text-decoration:underline dotted}
.tag-edit:hover{opacity:.8}
.tag-input{font:500 11px var(--mono);padding:2px 6px;border-radius:6px;border:1px solid var(--accent);background:var(--bg);color:var(--ink);outline:none}
td.c-num{font:500 12px var(--mono);color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.c-act{white-space:nowrap;text-align:right}
td.c-act .btn{margin-left:6px}
.row-actions{display:inline-flex;gap:6px}

/* ── feedback / discuss ── */
.flist,.dlist{display:none}
.fcard,.drow{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm);padding:14px 16px;margin-bottom:10px;animation:rowIn .25s ease-out both}
.fcard .f-head,.drow .d-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.fcard .f-title,.drow .d-title{font-size:14px;font-weight:600;flex:1}
.fcard .f-time,.drow .d-time{font-size:11px;color:var(--faint)}
.fcard .f-body,.drow .d-body{font-size:13px;color:var(--muted);white-space:pre-wrap;word-break:break-word}
.fcard .f-reply{font-size:12.5px;color:var(--ok);margin-top:8px;padding:8px 10px;background:var(--ok-soft);border-radius:7px}
.fcard .f-actions,.drow .d-actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.drow .d-replies{margin-top:8px;padding-left:12px;border-left:2px solid var(--line)}
.drow .d-replies .r{padding:4px 0;font-size:12.5px;color:var(--muted)}
.drow .d-replies .r .who{color:var(--accent);font-weight:600;font-size:12px}
.admin-post{background:var(--surface);border:1px solid var(--warn);border-radius:var(--radius);padding:14px 16px;margin-top:14px}
.admin-post input,.admin-post textarea{width:100%;padding:8px 11px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:13px;outline:none;font-family:inherit;margin-bottom:8px;resize:vertical}
.admin-post input:focus,.admin-post textarea:focus{border-color:var(--accent)}

/* ── stats dashboard ── */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;gap:8px;transition:border-color .15s,transform .15s}
.stat:hover{border-color:var(--line-strong);transform:translateY(-1px)}
.stat .ic{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--accent);background:var(--accent-soft)}
.stat.ok .ic{color:var(--ok);background:var(--ok-soft)}
.stat.warn .ic{color:var(--warn);background:var(--warn-soft)}
.stat.danger .ic{color:var(--danger);background:var(--danger-soft)}
.stat .val{font-size:22px;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums;line-height:1.1}
.stat .lbl{font-size:11px;color:var(--faint)}
.alert-pending{display:flex;align-items:center;gap:12px;background:var(--warn-soft);border:1px solid rgba(183,121,31,.3);border-radius:var(--radius);padding:12px 16px;margin-bottom:14px;animation:rowIn .25s ease-out both}
.alert-pending b{color:var(--warn);font-size:14px;white-space:nowrap}
.alert-pending span{color:var(--muted);font-size:12.5px}
.alert-pending .btn{margin-left:auto}
.range-bar{display:flex;justify-content:flex-end;align-items:center;gap:5px;margin-bottom:12px}
.range-bar span{font-size:11px;color:var(--faint);margin-right:4px}
.range-btn{border:1px solid var(--line);background:var(--surface);color:var(--muted);font:500 11.5px var(--sans);padding:4px 10px;border-radius:6px;cursor:pointer;transition:all .13s}
.range-btn:hover{color:var(--ink)}
.range-btn.active{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.chart-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow-sm)}
.chart-card.trend{grid-column:1/-1}
.chart-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.chart-head h3{font-size:13px;font-weight:600;color:var(--ink)}
.chart-head .seg{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.chart-head .seg button{border:none;background:none;font:500 11.5px var(--sans);color:var(--muted);padding:5px 12px;cursor:pointer;transition:all .13s}
.chart-head .seg button:hover{color:var(--ink)}
.chart-head .seg button.active{background:var(--accent);color:#fff}
.chart-card canvas{max-width:100%;display:block}
.hbar-list,.qlist{display:flex;flex-direction:column;gap:9px;padding-top:4px}
.hbar-row{display:flex;align-items:center;gap:10px}
.hbar-lbl{width:68px;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-shrink:0}
.hbar-track{flex:1;height:14px;background:var(--bg);border-radius:7px;overflow:hidden}
.hbar-fill{height:100%;border-radius:7px;background:linear-gradient(90deg,var(--accent),#818cf8);transition:width .5s ease}
.hbar-val{width:36px;text-align:right;font:600 11px var(--mono);color:var(--muted);flex-shrink:0}
.qrow{display:flex;align-items:center;gap:10px}
.q-lbl{width:74px;font-size:12px;color:var(--muted);flex-shrink:0}
.q-track{flex:1;height:10px;background:var(--bg);border-radius:5px;overflow:hidden}
.q-fill{height:100%;border-radius:5px;background:linear-gradient(90deg,var(--ok),#2dd4bf);transition:width .5s ease}
.q-val{width:42px;text-align:right;font:600 11px var(--mono);color:var(--muted);flex-shrink:0}
.anomaly-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.anomaly-grid h4{font-size:12px;color:var(--muted);margin-bottom:8px;font-weight:600}
.a-item{display:flex;align-items:center;gap:8px;padding:6px 9px;border-radius:7px;background:var(--bg);margin-bottom:5px;font-size:12px}
.a-item code{font:600 12px var(--mono);color:var(--accent)}
.a-item .a-n{color:var(--danger);font-weight:700;font-size:11px}
.a-item .btn{margin-left:auto;padding:3px 9px;font-size:11px}
.donut-sub{display:flex;justify-content:center;gap:16px;margin-top:4px;font-size:12px;color:var(--muted)}
.donut-sub b{font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.chart-card .hint{font-size:11px;color:var(--faint);margin-top:8px}
@media(max-width:900px){.stats{grid-template-columns:repeat(2,1fr)}.dash-grid{grid-template-columns:1fr}.anomaly-grid{grid-template-columns:1fr}}
@media(max-width:480px){.stats{grid-template-columns:1fr 1fr}.stat{padding:10px 12px}.stat .val{font-size:18px}}

.empty{text-align:center;padding:60px 0;color:var(--faint)}
.empty b{display:block;color:var(--muted);margin-bottom:4px}

/* ── toast / modal ── */
.toast-container{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);z-index:999;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast-msg{padding:10px 18px;border-radius:9px;font-size:13px;color:#fff;box-shadow:var(--shadow-md);font-weight:500}
.toast-msg.ok{background:var(--ok)}.toast-msg.err{background:var(--danger)}.toast-msg.info{background:var(--accent)}
.overlay{position:fixed;inset:0;z-index:300;display:none;background:rgba(0,0,0,.5);backdrop-filter:blur(3px);align-items:center;justify-content:center}
.overlay.show{display:flex}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px;width:400px;max-width:90vw;box-shadow:var(--shadow-md)}
.modal h3{font-size:15px;font-weight:700;margin-bottom:14px;text-align:center}
.modal textarea{width:100%;padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:13.5px;outline:none;resize:vertical;font-family:inherit;min-height:80px}
.modal textarea:focus{border-color:var(--accent)}
.modal .m-btns{display:flex;gap:8px;margin-top:14px;justify-content:flex-end}

@media(max-width:820px){
  .sidebar{position:static;width:100%;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:10px 12px;gap:4px;border-right:none;border-bottom:1px solid var(--line)}
  .sidebar .brand{border:none;padding:0;margin:0 10px 0 4px}
  .slabel{display:none}
  .snav{flex-direction:row;flex-wrap:wrap}
  .snav button{padding:6px 9px;font-size:12px}
  .snav button em{display:none}
  .sidebar .foot{margin:0;padding:0;border:none;flex-direction:row;width:100%;justify-content:flex-end}
  .sidebar .foot .btn{width:auto}
  .main{width:100%}
  .mbar{padding:10px 14px}
  .content{padding:12px 14px 50px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}
</style>
<script src="../shared/js/config.js?v=4.2.0"></script>
<script src="../shared/js/sanitize.js?v=4.2.0"></script>
<script src="../shared/js/api.js?v=4.2.0"></script>
<script src="../shared/js/charts.js?v=4.2.0"></script>
<script src="../shared/js/paginate.js?v=4.2.0"></script>
<script src="../shared/js/batch.js?v=4.2.0"></script>
<script src="../shared/js/cache.js?v=4.2.0"></script>
</head>
<body>

<!-- LOGIN -->
<div class="login-screen" id="loginBox">
  <div class="login-card">
    <div class="brand">BSide Olivia Lin<small>Admin Console</small></div>
    <div class="step"><i id="step1" class="on"></i><i id="step2"></i></div>
    <input type="password" id="pwInput" placeholder="管理密码" autocomplete="off">
    <input type="text" id="totpInput" placeholder="Authenticator 6 位码" maxlength="6" style="display:none" autocomplete="off" inputmode="numeric">
    <button id="loginBtn" onclick="doLogin()">进入管理</button>
    <div class="err" id="loginErr" aria-live="polite"></div>
  </div>
</div>

<!-- APP -->
<div class="app" id="mainBox" style="display:none">
  <aside class="sidebar">
    <a class="brand" href="#"><b>BSide Olivia Lin</b><small>Admin Console</small></a>
    <div class="slabel">审核</div>
    <nav class="snav" id="snav">
      <button class="active" data-filter="pending"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>待审核<em id="pendingCount">0</em></button>
      <button data-filter="all"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3h18v18H3z"/></svg>全部</button>
      <button data-filter="approved"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>已通过</button>
      <button data-filter="rejected"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>已拒绝</button>

// ---- Toast ----
function showToast(msg,type='info'){
  const c=document.getElementById('toastContainer');if(!c)return
  const d=document.createElement('div');d.className='toast-msg '+type;d.textContent=msg;c.appendChild(d)
  setTimeout(()=>{d.style.opacity='0';d.style.transition='opacity 0.3s';setTimeout(()=>d.remove(),300)},2500)
}

// ---- SHA256 ----
async function sha256(str){const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(str));return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('')}

// ---- Auth ----
async function doLogin(){
  if(_loginStage===0){
    const pw=document.getElementById('pwInput').value
    if(!pw){document.getElementById('loginErr').textContent='请输入密码';return}
    try{const r=await adminApi('check_pw',{},pw);if(!r||r.error){document.getElementById('loginErr').textContent='密码错误';return}}catch(e){document.getElementById('loginErr').textContent=e.name==='AbortError'?'连接超时，检查网络后刷新重试':'验证失败: '+(e.message||'网络异常');return}
    sessionStorage.setItem("admin_pw",pw)
    _loginStage=1
    document.getElementById('pwInput').style.display='none'
    document.getElementById('totpInput').style.display='block'
    document.getElementById('step1').classList.remove('on');document.getElementById('step2').classList.add('on')
    document.getElementById('loginBtn').textContent='验证 TOTP'
    document.getElementById('loginErr').textContent=''
    document.getElementById('pwInput').value=''
    document.getElementById('totpInput').focus()
    return
  }
  const code=document.getElementById('totpInput').value.trim();document.getElementById('loginErr').textContent=''
  if(!code||!/^\d{6}$/.test(code)){document.getElementById('loginErr').textContent='请输入6位验证码';return}
  try{const r=await adminApi('check_totp',{code});if(r!==true){document.getElementById('loginErr').textContent='验证码错误';return}}catch(e){document.getElementById('loginErr').textContent='验证失败';return}
  const tok=Array.from(crypto.getRandomValues(new Uint8Array(16))).map(b=>b.toString(16).padStart(2,'0')).join('')
  localStorage.setItem('admin_session',tok)
  showMain()
}
function showMain(){
  document.getElementById('loginBox').style.display='none';document.getElementById('mainBox').style.display='flex';init()
}
function exportCSV(){
  var items=dataCache;if(!items.length){showToast('无数据可导出','info');return}
  var csv='code,title,description,tags,views,likes,status,created_at\n';
  items.forEach(function(x){csv+=[x.code,x.title,(x.description||'').replace(/"/g,'""'),(x.tags||'').replace(/"/g,'""'),x.views,x.likes,x.status,x.created_at].map(function(v){return'"'+v+'"'}).join(',')+'\n'});
  var blob=new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='linli_codes_'+new Date().toISOString().slice(0,10)+'.csv';a.click();
}
function doLogout(){localStorage.removeItem('admin_session');sessionStorage.removeItem('admin_pw');document.getElementById('loginBox').style.display='flex';document.getElementById('mainBox').style.display='none'}
function toggleAuto(){autoApprove=!autoApprove;document.getElementById('autoBtn').textContent='自动通过：'+(autoApprove?'开':'关');document.getElementById('autoBtn').className='btn '+(autoApprove?'primary':'');showToast(autoApprove?'新提交将自动通过':'新提交需手动审核','info')}

// ---- API ----
const SB_URL='https://naivizrdefonlelndzqr.supabase.co';const EDGE_URL="https://naivizrdefonlelndzqr.supabase.co/functions/v1/admin";
const SB_KEY='sb_publishable_-LpxA4RGDCS-NzuHoeMYDg_jD7bdDTq';
const sbApi = async function(path, options = {}) {
  const url=`${SB_URL}/rest/v1/${path}`;
  const hdrs={apikey:SB_KEY,Authorization:'Bearer '+SB_KEY,'Content-Type':'application/json',Prefer:'return=minimal',...(options.headers||{})};
  const res=await fetch(url,{headers:hdrs,method:options.method||'GET',body:options.body});
  if(!res.ok)throw new Error(await res.text());
  const t=await res.text();return t?JSON.parse(t):[];
}
async function adminApi(action, payload={}, passOverride){
  const pw=passOverride||sessionStorage.getItem("admin_pw")||"";
  const ctrl=new AbortController();const timer=setTimeout(()=>ctrl.abort(),15000);
  try{
    const res=await fetch(EDGE_URL,{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+SB_KEY},body:JSON.stringify({password:pw,action,payload}),signal:ctrl.signal});
    clearTimeout(timer);
    if(!res.ok)throw new Error(await res.text());
    return res.json();
  }catch(e){clearTimeout(timer);throw e}
}

// ---- Init / navigation ----

// ---- Load ----
async function load(){
  try{
    dataCache=await sbApi('linli_codes?select=*&order=created_at.desc&limit=1000')
    if(autoApprove&&dataCache.length){
      var pending=dataCache.filter(function(x){return x.status==='pending'});
      if(pending.length){try{await adminApi('batch_approve',{ids:pending.map(function(x){return x.id})});dataCache.forEach(function(x){if(x.status==='pending')x.status='approved'})}catch(e){}}
    }
    var pc=document.getElementById('pendingCount');if(pc)pc.textContent=dataCache.filter(function(x){return x.status==='pending'}).length
    if(filter==='data'){renderStats();renderDashboard()}
    renderList()
  }catch(e){console.error(e);document.getElementById('empty').style.display='block';document.getElementById('empty').innerHTML='<b>加载失败</b>请检查网络后刷新重试'}

function kpiIcon(n){var p={pending:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/>',approved:'<path d="M20 6 9 17l-5-5"/>',total:'<path d="M12 2 2 7l10 5 10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/>',dupe:'<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',view:'<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>',like:'<path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>',users:'<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',report:'<path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><path d="M12 9v4"/><path d="M12 17h.01"/>'};return '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+p[n]+'</svg>'}
async function renderStats(){
  const all=dataCache;const dupeMap=new Map();all.forEach(x=>{const c=x.code;dupeMap.set(c,(dupeMap.get(c)||0)+1)})
  const dupeCount=[...dupeMap.values()].filter(v=>v>1).length
  let pvCount=0;try{const pv=await sbApi('page_visits?select=id&order=id.desc&limit=1');pvCount=pv[0]?.id||0}catch(e){}
  const totalViews=all.reduce((s,x)=>s+(x.views||0),0);const totalLikes=all.reduce((s,x)=>s+(x.likes||0),0)
  const totalReports=all.reduce((s,x)=>s+(x.reports||0),0)
  const pending=all.filter(x=>x.status==='pending').length,approved=all.filter(x=>x.status==='approved').length
  const kpis=[
    {ic:'pending',v:pending,l:'待审核',tone:pending>0?'warn':''},
    {ic:'approved',v:approved,l:'已通过',tone:'ok'},
    {ic:'total',v:all.length,l:'总分享码'},
    {ic:'dupe',v:dupeCount,l:'重复码',tone:dupeCount>0?'danger':''},
    {ic:'view',v:totalViews,l:'累计浏览'},
    {ic:'like',v:totalLikes,l:'累计点赞'},
    {ic:'users',v:pvCount,l:'页面访问'},
    {ic:'report',v:totalReports,l:'无效反馈',tone:totalReports>0?'danger':''}
  ]
  document.getElementById('stats').innerHTML=kpis.map(s=>'<div class="stat'+(s.tone?' '+s.tone:'')+'"><div class="ic">'+kpiIcon(s.ic)+'</div><div class="val">'+s.v+'</div><div class="lbl">'+s.l+'</div></div>').join('')
  var pa=document.getElementById('pendingAlert')
  if(pending>0){pa.style.display='flex';pa.innerHTML='<b>'+pending+' 条分享码待审核</b><span>新提交需要你处理</span><button class="btn primary" onclick="switchTab(\'pending\')">前往审核</button>'}
  else{pa.style.display='none'}
}

function tagCat(tags,title){var t=((tags||'')+' '+(title||'')).toLowerCase();var words=t.split(/[\s,]+/);for(var i=0;i<TAG_CATS.length;i++){var c=TAG_CATS[i];if(!c.k.length)continue;for(var j=0;j<c.k.length;j++){var kw=c.k[j].toLowerCase();for(var w=0;w<words.length;w++){if(words[w]===kw)return c.id}if(kw.length>=2&&t.indexOf(kw)>=0)return c.id}}return 'other'}

window._chartMode='24h'
function setRange(mode){window._chartMode=mode;document.querySelectorAll('.range-btn').forEach(function(b){b.classList.remove('active')});var btn=document.getElementById(mode==='all'?'rall':'r'+mode);if(btn)btn.classList.add('active');renderDashboard()}
function timeSlots(mode){var now=new Date(),slots=[],i;if(mode==='24h'){for(i=23;i>=0;i--){var h=new Date(now);h.setHours(h.getHours()-i);slots.push({label:h.getHours()+':00',value:0,ts:h})}}else if(mode==='7d'){for(i=6;i>=0;i--){var d=new Date(now);d.setDate(d.getDate()-i);slots.push({label:(d.getMonth()+1)+'/'+d.getDate(),value:0,ts:d})}}else if(mode==='30d'){for(i=29;i>=0;i--){var d2=new Date(now);d2.setDate(d2.getDate()-i);slots.push({label:(d2.getMonth()+1)+'/'+d2.getDate(),value:0,ts:d2})}}else{for(i=11;i>=0;i--){var m=new Date(now.getFullYear(),now.getMonth()-i,1);slots.push({label:(m.getMonth()+1)+'月',value:0,ts:m})}}return slots}
function slotIndex(slots,targetDate,mode){var diffMs=targetDate.getTime();for(var i=slots.length-1;i>=0;i--){var slotMs=slots[i].ts.getTime();if(mode==='all'){if(diffMs>=slotMs)return i}else if(mode==='24h'){if(diffMs>=slotMs&&diffMs<slotMs+3600000)return i}else{if(targetDate.toDateString()===slots[i].ts.toDateString())return i}}return -1}

window._trendMetric='up'
function modeLabel(m){return {'24h':'24h','7d':'7天','30d':'30天','all':'月度'}[m]||m}
function rangeStartISO(mode){var d=new Date();if(mode==='24h')d.setHours(d.getHours()-24);else if(mode==='7d')d.setDate(d.getDate()-7);else if(mode==='30d')d.setDate(d.getDate()-30);else d=new Date(d.getFullYear()-1,d.getMonth(),1);return d.toISOString()}
function switchTrend(m){window._trendMetric=m;document.querySelectorAll('#trendSeg button').forEach(function(b){b.classList.toggle('active',b.dataset.metric===m)});renderTrendArea()}
function renderDashboard(){renderTrendArea();renderStatusDonut();renderCatRank();renderAuthorRank();renderQuality();renderAnomaly()}

// ---- 自定义 Canvas：平滑面积图 + 环形图 ----
function roundRectPath(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
window.drawAreaChart=function(canvas,data,opts){
  opts=opts||{};var w=opts.width||1200,h=opts.height||240,title=opts.title||'',color=opts.color||'#1D5BF0';
  function dark(){return document.documentElement.classList.contains('dark')}
  canvas._chartData=data;
  function draw(){
    var rect=canvas.parentElement?canvas.parentElement.getBoundingClientRect():null;var cw=rect?Math.min(rect.width-20,w):w;
    var dpr=window.devicePixelRatio||1;canvas.width=cw*dpr;canvas.height=h*dpr;canvas.style.width=cw+'px';canvas.style.height=h+'px';
    var ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);
    canvas._chartCw=cw;canvas._chartPts=[];
    if(!data.length){ctx.clearRect(0,0,cw,h);return}
    var pad={top:title?28:10,right:8,bottom:26,left:38},pw=cw-pad.left-pad.right,ph=h-pad.top-pad.bottom;
    var max=Math.max.apply(null,data.map(function(d){return d.value}))||1;
    ctx.font='9px system-ui';ctx.textAlign='right';
    for(var i=0;i<=4;i++){var v=Math.round(max*i/4),y=pad.top+ph-(v/max)*ph;ctx.fillStyle='#889';ctx.fillText(v,pad.left-4,y+3);ctx.strokeStyle='rgba(128,128,128,0.12)';ctx.beginPath();ctx.moveTo(pad.left,y);ctx.lineTo(cw-pad.right,y);ctx.stroke()}
    var step=data.length>1?pw/(data.length-1):0;
    var pts=data.map(function(d,i){return{x:pad.left+i*step,y:pad.top+ph-(d.value/max)*ph}});
    canvas._chartPts=pts;
    var grad=ctx.createLinearGradient(0,pad.top,0,pad.top+ph);grad.addColorStop(0,color+'55');grad.addColorStop(1,color+'00');
    ctx.beginPath();ctx.moveTo(pts[0].x,pad.top+ph);pts.forEach(function(p){ctx.lineTo(p.x,p.y)});ctx.lineTo(pts[pts.length-1].x,pad.top+ph);ctx.closePath();ctx.fillStyle=grad;ctx.fill();
    ctx.beginPath();pts.forEach(function(p,j){if(j===0)ctx.moveTo(p.x,p.y);else ctx.lineTo(p.x,p.y)});ctx.strokeStyle=color;ctx.lineWidth=2;ctx.lineJoin='round';ctx.lineCap='round';ctx.stroke();
    if(pts.length<=14)pts.forEach(function(p){ctx.beginPath();ctx.arc(p.x,p.y,2.6,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();ctx.strokeStyle=color;ctx.lineWidth=1.4;ctx.stroke()});
    ctx.font='9px system-ui';ctx.textAlign='center';var sl=Math.ceil(data.length/10);
    data.forEach(function(d,i){if(i%sl===0||i===data.length-1){ctx.fillStyle='#94a3b8';ctx.fillText(d.label,pad.left+i*step,pad.top+ph+16)}});
    if(title){ctx.fillStyle=dark()?'#ccc':'#555';ctx.font='bold 12px system-ui';ctx.textAlign='left';ctx.fillText(title,pad.left,18)}
  }
  draw();
  if(!canvas._tipReady){
    canvas._tipReady=true;
    var tip=document.createElement('div');
    tip.style.cssText='position:absolute;display:none;pointer-events:none;background:'+(dark()?'rgba(15,23,42,.95)':'rgba(255,255,255,.96)')+';color:'+(dark()?'#e2e8f0':'#1e293b')+';padding:5px 10px;border-radius:7px;font-size:11px;white-space:nowrap;z-index:999;box-shadow:0 2px 10px rgba(0,0,0,.18);border:1px solid '+(dark()?'rgba(255,255,255,.12)':'rgba(0,0,0,.08)');
    var parent=canvas.parentElement;if(parent){parent.style.position='relative';parent.appendChild(tip)}
    canvas.addEventListener('mousemove',function(e){
      var pts=canvas._chartPts||[],data=canvas._chartData||[],cw=canvas._chartCw||0;
      if(!pts.length){tip.style.display='none';return}
      var rect=canvas.getBoundingClientRect(),dpr=window.devicePixelRatio||1;
      var scaleX=rect.width/(canvas.width/dpr),scaleY=rect.height/(canvas.height/dpr);
      var mx=(e.clientX-rect.left)/scaleX;
      var idx=0,best=Infinity;
      for(var i=0;i<pts.length;i++){var dx=Math.abs(pts[i].x-mx);if(dx<best){best=dx;idx=i}}
      if(idx>=0&&best<=(cw/(data.length||1))*0.75){
        var p=pts[idx],d=data[idx];
        tip.style.display='block';
        tip.style.left=(p.x*scaleX)+'px';
        tip.style.top=Math.max(2,p.y*scaleY-28)+'px';
        tip.style.transform='translateX(-50%)';
        tip.textContent=d.label+'：'+d.value;
      }else{tip.style.display='none'}
    });
    canvas.addEventListener('mouseleave',function(){tip.style.display='none'});
  }
  if(window.ResizeObserver){try{var ro=new ResizeObserver(draw);if(canvas._ro)canvas._ro.disconnect();canvas._ro=ro;ro.observe(canvas.parentElement)}catch(e){}}
}
window.drawDonut=function(canvas,data,opts){
  opts=opts||{};var size=opts.size||210,title=opts.title||'',colors=opts.colors||['#1D5BF0','#818cf8','#34d399','#fbbf24','#ef4444','#f472b6'],onClick=opts.onClick;
  var totalH=title?260:240,legendW=110;
  function dark(){return document.documentElement.classList.contains('dark')}
  function draw(){
    var W=size+legendW,dpr=window.devicePixelRatio||1;canvas.width=W*dpr;canvas.height=totalH*dpr;canvas.style.width=W+'px';canvas.style.height=totalH+'px';
    var ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);
    var cx=90,cy=title?120:110,r=78,ir=48;
    var total=data.reduce(function(s,d){return s+d.value},0)||1;
    var bg=dark()?'#121316':'#fff';
    if(title){ctx.fillStyle=dark()?'#ccc':'#555';ctx.font='bold 12px system-ui';ctx.textAlign='left';ctx.fillText(title,10,18)}
    var a=-Math.PI/2,slices=[];
    data.forEach(function(d,i){var sw=d.value/total*2*Math.PI;if(sw<=0)return;ctx.beginPath();ctx.fillStyle=d.color||colors[i%colors.length];ctx.moveTo(cx,cy);ctx.arc(cx,cy,r,a,a+sw);ctx.closePath();ctx.fill();ctx.strokeStyle=bg;ctx.lineWidth=2;ctx.stroke();slices.push({startAngle:a,endAngle:a+sw,cx:cx,cy:cy,r:r,label:d.label,value:d.value,_raw:d});a+=sw});
    ctx.beginPath();ctx.arc(cx,cy,ir,0,Math.PI*2);ctx.fillStyle=bg;ctx.fill();
    ctx.fillStyle=dark()?'#e2e8f0':'#1e293b';ctx.font='bold 20px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(total,cx,cy-6);
    ctx.fillStyle='#889';ctx.font='10px system-ui';ctx.fillText('总计',cx,cy+14);ctx.textBaseline='alphabetic';
    data.forEach(function(d,i){var ly=(title?24:14)+i*21;ctx.fillStyle=d.color||colors[i%colors.length];roundRectPath(ctx,188,ly,10,10,3);ctx.fill();ctx.fillStyle=dark()?'#ccc':'#555';ctx.font='10px system-ui';ctx.textAlign='left';var pct=Math.round(d.value/total*100);ctx.fillText(d.label+'  '+pct+'%',206,ly+8)});
    if(onClick){canvas.onclick=function(e){var rect=canvas.getBoundingClientRect(),mx=(e.clientX-rect.left)*(W/rect.width),my=(e.clientY-rect.top)*(totalH/rect.height);for(var i=0;i<slices.length;i++){var s=slices[i],dx=mx-s.cx,dy=my-s.cy,dist=Math.sqrt(dx*dx+dy*dy);if(dist<=s.r&&dist>=ir){var ang=Math.atan2(dy,dx);var na=ang<-Math.PI/2?ang+2*Math.PI:ang;var ns=s.startAngle<-Math.PI/2?s.startAngle+2*Math.PI:s.startAngle;var ne=s.endAngle<-Math.PI/2?s.endAngle+2*Math.PI:s.endAngle;if(na>=ns&&na<=ne){onClick(s._raw);return}}}};canvas.style.cursor='pointer'}
  }
  draw();
  if(window.ResizeObserver){try{var ro=new ResizeObserver(draw);if(canvas._ro)canvas._ro.disconnect();canvas._ro=ro;ro.observe(canvas.parentElement)}catch(e){}}
}

// ---- 仪表盘渲染 ----
function renderTrendArea(){
  var mode=window._chartMode||'24h',metric=window._trendMetric||'up',label=modeLabel(mode)+' '+(metric==='up'?'上传量':'浏览量');
  var slots=timeSlots(mode);
  dataCache.forEach(function(x){if(!x.created_at)return;var d=new Date(x.created_at),idx=slotIndex(slots,d,mode);if(idx>=0)slots[idx].value++});
  if(metric==='view'){
    var start=rangeStartISO(mode);
    sbApi('page_visits?select=visited_at&page=eq.linli&visited_at=gte.'+encodeURIComponent(start)+'&order=visited_at.desc&limit=5000').then(function(pv){var vs=timeSlots(mode);pv.forEach(function(v){if(!v.visited_at)return;var d=new Date(v.visited_at),idx=slotIndex(vs,d,mode);if(idx>=0)vs[idx].value++});try{window.drawAreaChart(document.getElementById('chartTrend'),vs.length?vs:[{label:'-',value:1}],{title:label,color:'#34d399'})}catch(e){}}).catch(function(e){try{window.drawAreaChart(document.getElementById('chartTrend'),slots.length?slots:[{label:'-',value:1}],{title:label,color:'#34d399'})}catch(e){}});
  }else{
    try{window.drawAreaChart(document.getElementById('chartTrend'),slots.length?slots:[{label:'-',value:1}],{title:label,color:'#818cf8'})}catch(e){}
  }
}
function renderStatusDonut(){
  var status=[{label:'已通过',value:dataCache.filter(function(x){return x.status==='approved'}).length,color:'#34d399'},{label:'待审核',value:dataCache.filter(function(x){return x.status==='pending'}).length,color:'#fbbf24'},{label:'已拒绝',value:dataCache.filter(function(x){return x.status==='rejected'}).length,color:'#ef4444'}];
  try{window.drawDonut(document.getElementById('chartStatus'),status.length?status:[{label:'-',value:1}],{onClick:function(d){switchTabByStatus(d.label)}})}catch(e){}
  var total=status.reduce(function(s,x){return s+x.value},0)||1,pass=Math.round(status[0].value/total*100);
  document.getElementById('statusSub').innerHTML='<span>通过率 <b>'+pass+'%</b></span><span>待审 <b>'+status[1].value+'</b></span><span>拒绝 <b>'+status[2].value+'</b></span>';
}
function renderCatRank(){
  var c={};dataCache.forEach(function(x){var n=tagCatName(tagCat(x.tags,x.title));c[n]=(c[n]||0)+1});
  var arr=Object.keys(c).map(function(k){return{label:k,value:c[k]}}).sort(function(a,b){return b.value-a.value}).slice(0,6);
  var max=arr.length?arr[0].value:1;
  document.getElementById('catRank').innerHTML=arr.length?arr.map(function(x){return '<div class="hbar-row"><span class="hbar-lbl">'+escapeHtml(x.label)+'</span><div class="hbar-track"><div class="hbar-fill" style="width:'+Math.max(4,x.value/max*100)+'%"></div></div><span class="hbar-val">'+x.value+'</span></div>'}).join(''):'<div style="color:var(--faint);font-size:12px">暂无数据</div>';
}
function renderAuthorRank(){
  var c={};dataCache.forEach(function(x){var a=(x.author||'匿名').trim()||'匿名';c[a]=(c[a]||0)+1});
  var arr=Object.keys(c).map(function(k){return{label:k,value:c[k]}}).sort(function(a,b){return b.value-a.value}).slice(0,6);
  var max=arr.length?arr[0].value:1;
  document.getElementById('authorRank').innerHTML=arr.length?arr.map(function(x){return '<div class="hbar-row"><span class="hbar-lbl">'+escapeHtml(x.label)+'</span><div class="hbar-track"><div class="hbar-fill" style="width:'+Math.max(4,x.value/max*100)+'%;background:linear-gradient(90deg,#34d399,#2dd4bf)"></div></div><span class="hbar-val">'+x.value+'</span></div>'}).join(''):'<div style="color:var(--faint);font-size:12px">暂无数据</div>';
}
function renderQuality(){
  var n=dataCache.length||1;
  var withDesc=dataCache.filter(function(x){return x.description&&x.description.trim()}).length;
  var withTags=dataCache.filter(function(x){return x.tags&&x.tags.trim()}).length;
  var withAuthor=dataCache.filter(function(x){return x.author&&x.author!=='匿名'}).length;
  var approved=dataCache.filter(function(x){return x.status==='approved'}).length;
  document.getElementById('quality').innerHTML=[
    {l:'有简介',v:Math.round(withDesc/n*100)},{l:'有标签',v:Math.round(withTags/n*100)},{l:'署名作者',v:Math.round(withAuthor/n*100)},{l:'已通过',v:Math.round(approved/n*100)}
  ].map(function(x){return '<div class="qrow"><span class="q-lbl">'+x.l+'</span><div class="q-track"><div class="q-fill" style="width:'+x.v+'%"></div></div><span class="q-val">'+x.v+'%</span></div>'}).join('');
}
function renderAnomaly(){
  var dupeMap={};dataCache.forEach(function(x){dupeMap[x.code]=(dupeMap[x.code]||0)+1});
  var dupes=Object.keys(dupeMap).filter(function(k){return dupeMap[k]>1}).sort(function(a,b){return dupeMap[b]-dupeMap[a]}).slice(0,5);
  var reports=dataCache.filter(function(x){return(x.reports||0)>0}).sort(function(a,b){return(b.reports||0)-(a.reports||0)}).slice(0,5);
  document.getElementById('dupeList').innerHTML=dupes.length?dupes.map(function(k){return '<div class="a-item"><code>'+escapeHtml(k)+'</code><span class="a-n">×'+dupeMap[k]+'</span></div>'}).join(''):'<div style="color:var(--faint);font-size:12px">无重复码</div>';
  document.getElementById('reportList').innerHTML=reports.length?reports.map(function(x){return '<div class="a-item"><span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+escapeHtml(x.title||x.code)+'</span><span class="a-n">'+(x.reports||0)+'</span><button class="btn sm" onclick="switchTab(\'reported\')">处理</button></div>'}).join(''):'<div style="color:var(--faint);font-size:12px">无异常举报</div>';
}
function scrollToItem(id){var rows=document.querySelectorAll('#list tr');for(var i=0;i<rows.length;i++){if(rows[i].innerHTML.indexOf('onclick="approve('+id+')"')>0||rows[i].innerHTML.indexOf('onclick="del('+id+')"')>0){rows[i].scrollIntoView({behavior:'smooth',block:'center'});rows[i].style.boxShadow='0 0 0 2px var(--accent)';setTimeout(function(){rows[i].style.boxShadow=''},2000);return}}switchTab('approved');setTimeout(function(){scrollToItem(id)},300)}
function switchTabByStatus(label){if(label==='已通过')switchTab('approved');else if(label==='待审核')switchTab('pending');else if(label==='已拒绝')switchTab('rejected')}
function switchTab(target){filter=target;document.querySelectorAll('#snav button,.snav button').forEach(function(t){t.classList.toggle('active',t.dataset.filter===target)});switchPanel(target)}

// ---- Render list (table) ----
function renderList(){
  const lst=document.getElementById('list'),em=document.getElementById('empty')
  lst.innerHTML='';em.style.display='none'
  var items=dataCache
  if(filter==='reported')items=dataCache.filter(function(x){return(x.reports||0)>0})
  else if(filter!=='all'&&filter!=='discuss'&&filter!=='data')items=dataCache.filter(function(x){return x.status===filter})
  if(_searchQ){items=items.filter(function(x){return(x.code||'').toLowerCase().indexOf(_searchQ)>=0||(x.title||'').toLowerCase().indexOf(_searchQ)>=0||(x.tags||'').toLowerCase().indexOf(_searchQ)>=0})}
  if(_catFilter){items=items.filter(function(x){return tagCat(x.tags,x.title)===_catFilter})}
  if(!items.length){em.style.display='block';em.innerHTML='<b>暂无数据</b>';return}
  const dupeMap=new Map();items.forEach(x=>{const c=x.code;dupeMap.set(c,(dupeMap.get(c)||0)+1)})
  const dupeSet=new Set([...dupeMap.entries()].filter(([,v])=>v>1).map(([k])=>k))
  items=[...items].sort((a,b)=>{const da=dupeSet.has(a.code),db=dupeSet.has(b.code);if(da&&db)return a.code.localeCompare(b.code)||b.id-a.id;if(da)return -1;if(db)return 1;return 0})
  var delay=0
  items.forEach((item,i)=>{
    const isDupe=dupeSet.has(item.code)
    const desc=item.description||(item.author&&item.author!=='匿名'?item.author:'')
    const tagList=item.tags?item.tags.split(/[\s,]+/).filter(Boolean):[]
    const stCls={pending:'pending',approved:'approved',rejected:'rejected'}[item.status]||''
    const stLabel={pending:'待审核',approved:'已通过',rejected:'已拒绝'}[item.status]||item.status
    const reported=(item.reports||0)>0
    const st=reported&&item.status==='approved'?'reported':stCls
    const stTxt=reported&&item.status==='approved'?'举报':stLabel
    const tr=document.createElement('tr');tr.style.animationDelay=Math.min(delay,300)+'ms';delay+=24
    tr.innerHTML=
      '<td><span class="st '+st+'">'+stTxt+(reported&&item.status==='approved'?' ('+(item.reports||0)+')':'')+'</span></td>'+
      '<td class="c-code"><span class="code">'+escapeHtml(item.code)+'</span>'+(isDupe?'<span class="dupe-tag">重复</span>':'')+'</td>'+
      '<td class="c-title">'+escapeHtml(item.title)+'<div class="sub">'+escapeHtml(desc)+'</div></td>'+
      '<td class="c-tags">'+(tagList.length?tagList.slice(0,3).map(function(t){return '<span class="t">'+escapeHtml(t)+'</span>'}).join('')+(tagList.length>3?'<span class="t">+'+(tagList.length-3)+'</span>':''):'<span style="color:var(--faint)">—</span>')+
      ' <span class="tag-edit" data-code="'+item.code+'" onclick="editTags(this)" title="点击编辑标签">编辑</span></td>'+
      '<td class="c-num">'+(item.views||0)+'</td>'+
      '<td class="c-num">'+(item.likes||0)+'</td>'+
      '<td class="c-act"><span class="row-actions">'+
        (item.status==='pending'?'<button class="btn ok sm" onclick="approve('+item.id+')">通过</button><button class="btn danger sm" onclick="reject('+item.id+')">拒绝</button>':'')+
        '<button class="btn sm" onclick="del('+item.id+')" style="color:var(--muted)">删除</button></span></td>'
    lst.appendChild(tr)
    tr.setAttribute('data-item-code',item.code);tr.setAttribute('data-item-tags',item.tags||'')
  })
}

// ---- Tag editing ----
function editTags(el){
  if(el.parentElement.querySelector('input'))return
  _isEditing=true
  var tr=el.closest('tr'),curTags=tr.getAttribute('data-item-tags')||''
  var w=Math.max(120,(curTags.length||4)*9)
  el.style.display='none'
  var inp=document.createElement('input');inp.className='tag-input';inp.value=curTags;inp.dataset.old=curTags
  inp.style.width=w+'px'
  inp.onkeydown=function(e){if(e.key==='Enter')saveTags(inp)}
  inp.onblur=function(){saveTags(inp)}
  el.insertAdjacentElement('beforebegin',inp)
  inp.focus();inp.select()
}
async function saveTags(input){
  var newTags=input.value.trim(),oldTags=input.dataset.old
  if(newTags===oldTags){cancelTagEdit(input);return}
  try{
    await adminApi('update_tags',{code:input.closest('tr').getAttribute('data-item-code'),tags:newTags})
    showToast('标签已更新','ok')
    var tr=input.closest('tr');if(tr)tr.setAttribute('data-item-tags',newTags)
    var tagList=newTags?newTags.split(/[\s,]+/).filter(Boolean):[]
    var tagTd=tr.querySelector('.c-tags');tagTd.innerHTML=(tagList.length?tagList.slice(0,3).map(function(t){return '<span class="t">'+escapeHtml(t)+'</span>'}).join('')+(tagList.length>3?'<span class="t">+'+(tagList.length-3)+'</span>':''):'<span style="color:var(--faint)">—</span>')+' <span class="tag-edit" data-code="'+tr.getAttribute('data-item-code')+'" onclick="editTags(this)" title="点击编辑标签">编辑</span>'
    _isEditing=false
  }catch(e){showToast('更新失败','err');cancelTagEdit(input)}
}
function cancelTagEdit(input){_isEditing=false;var td=input.closest('.c-tags');var tr=input.closest('tr');if(td){td.querySelector('.tag-edit').style.display=''}input.remove()}

// ---- Actions ----
async function approve(id){try{await adminApi('approve',{id});load();showToast('已通过','ok')}catch(e){showToast('操作失败','err')}}
async function reject(id){try{await adminApi('reject',{id});load();showToast('已拒绝','info')}catch(e){showToast('操作失败','err')}}
async function del(id){if(!confirm('确认删除？'))return;try{await adminApi('delete',{id});load();showToast('已删除','ok')}catch(e){showToast('操作失败','err')}}
async function approveAllPending(){const ids=dataCache.filter(i=>i.status==='pending').map(i=>i.id);if(!ids.length){showToast('没有待审核项','info');return}try{await adminApi('batch_approve',{ids});showToast('已全部通过 ('+ids.length+'条)','ok')}catch(e){showToast('操作失败','err')}load()}
async function rejectAllPending(){const ids=dataCache.filter(i=>i.status==='pending').map(i=>i.id);if(!ids.length){showToast('没有待审核项','info');return}try{await adminApi('batch_reject',{ids});showToast('已全部拒绝 ('+ids.length+'条)','info')}catch(e){showToast('操作失败','err')}load()}
async function deleteRejected(){const rejected=dataCache.filter(i=>i.status==='rejected');if(!rejected.length){showToast('没有已拒绝记录','info');return}if(!confirm('确认删除所有'+rejected.length+'条已拒绝记录？'))return;try{await adminApi('batch_delete',{ids:rejected.map(i=>i.id)});showToast('已清理 '+rejected.length+' 条','ok')}catch(e){showToast('操作失败','err')}load()}

// ---- Discuss ----
async function loadDiscuss(){try{var d=await sbApi('discussions?select=*&order=created_at.desc&limit=200');discussCache=d;renderDiscuss()}catch(e){}}
function renderDiscuss(){
  var lst=document.getElementById('discussList'),em=document.getElementById('empty')
  lst.innerHTML='';em.style.display='none'
  if(!discussCache.length){em.style.display='block';em.innerHTML='<b>暂无讨论</b>'}
  var threads=discussCache.filter(function(x){return!x.parent_id})
  threads.sort(function(a,b){return(b.pinned?1:0)-(a.pinned?1:0)||new Date(b.created_at)-new Date(a.created_at)})
  threads.forEach(function(t){
    var replies=discussCache.filter(function(r){return r.parent_id===t.id})
    var d=document.createElement('div');d.className='drow'
    var nameHtml=t.is_admin?'<span style="color:var(--warn);font-weight:700">Admin</span>':escapeHtml(t.name||'匿名用户')
    d.innerHTML='<div class="d-head"><div class="d-title">'+(t.pinned?'📌 ':'')+nameHtml+(t.reports>0?' <span class="dupe-tag">⚠'+(t.reports||0)+'</span>':'')+'</div><span class="d-time">'+new Date(t.created_at).toLocaleString('zh-CN')+'</span></div>'+
      '<div class="d-body">'+escapeHtml(t.content)+'</div>'+
      (replies.length?'<div class="d-replies">'+replies.map(function(r){return '<div class="r">'+(r.is_admin?'<span class="who">Admin</span>':escapeHtml(r.name||'匿名用户'))+' '+escapeHtml(r.content)+' <button class="btn sm" onclick="delDiscuss('+r.id+')" style="padding:1px 7px;font-size:11px">删</button></div>'}).join('')+'</div>':'')+
      '<div class="d-actions"><button class="btn warn sm" onclick="togglePin('+t.id+','+(t.pinned?0:1)+')">'+(t.pinned?'取消置顶':'置顶')+'</button><button class="btn sm" style="color:var(--warn);border-color:rgba(183,121,31,.35)" onclick="adminReply('+t.id+')">回复</button>'+(t.reports>0?'<button class="btn ok sm" onclick="clearReports('+t.id+')">清举报</button>':'')+'<button class="btn danger sm" onclick="delDiscuss('+t.id+')">删帖</button></div>'
    lst.appendChild(d)
  })
  var formDiv=document.createElement('div');formDiv.className='admin-post'
  formDiv.innerHTML='<input id="adminPostTitle" placeholder="标题" maxlength="80"><textarea id="adminPostContent" placeholder="内容…" maxlength="500" rows="2"></textarea><button class="btn warn" onclick="adminPost()">发布</button>'
  lst.appendChild(formDiv)
}
function adminReply(id){_adminReplyId=id;var ti=document.getElementById('adminPostTitle');if(ti)ti.style.display='none';var inp=document.getElementById('adminPostContent');if(inp){inp.placeholder='回复内容…';inp.focus()}}
function adminPost(){
  var title=document.getElementById('adminPostTitle').value.trim(),content=document.getElementById('adminPostContent').value.trim();if(!content){showToast('请填写内容','info');return};if(!_adminReplyId&&!title){showToast('请填写标题','info');return}
  adminApi('discuss_create',{content:content,parent_id:_adminReplyId||null,title:title}).then(function(){document.getElementById('adminPostTitle').value='';document.getElementById('adminPostTitle').style.display='';document.getElementById('adminPostContent').value='';_adminReplyId=0;document.getElementById('adminPostContent').placeholder='内容…';loadDiscuss()}).catch(function(e){showToast('发布失败: '+(e.message||''),'err')})
}
async function togglePin(id,pinned){try{await adminApi('discuss_pin',{id:id,pinned:!!pinned});loadDiscuss()}catch(e){showToast('操作失败','err')}}
async function clearReports(id){try{await adminApi('discuss_clear_reports',{id:id});loadDiscuss()}catch(e){}}
async function delDiscuss(id){if(!confirm('确认删除？子回复也会被删除'))return;try{await adminApi('discuss_delete',{id:id});loadDiscuss();showToast('已删除','ok')}catch(e){showToast('删除失败: '+(e.message||''),'err')}}

// ---- Theme ----
const html=document.documentElement;function applyTheme(mode){html.classList.remove("light","dark");if(mode==="light")html.classList.add("light");if(mode==="dark")html.classList.add("dark")}
const st=localStorage.getItem("theme");if(st)applyTheme(st)
document.getElementById("themeToggle").addEventListener("click",()=>{const cur=html.classList.contains("dark")?"dark":html.classList.contains("light")?"light":"auto";if(cur==="auto"){const sd=matchMedia("(prefers-color-scheme:dark)").matches;localStorage.setItem("theme",sd?"light":"dark");applyTheme(sd?"light":"dark")}else if(cur==="dark"){localStorage.setItem("theme","light");applyTheme("light")}else{localStorage.setItem("theme","dark");applyTheme("dark")}})

// ---- Auto refresh + session restore ----
setInterval(()=>{if(document.getElementById('mainBox').style.display!=='none'&&!_isEditing)load()},300000)
if(localStorage.getItem("admin_session")&&sessionStorage.getItem("admin_pw")){showMain()}
</script>
